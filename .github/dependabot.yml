version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ci-scripts/style-toolchain
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      style-toolchain:
        patterns: ["*"]
