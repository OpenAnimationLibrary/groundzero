name: PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: No PII
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/no_pii.yml

  # Run extended qualification from the platform, Neural Style, or SeExpr
  # workflows when needed. Keep the application and installed-package tests here.
  linux:
    name: Linux Build
    uses: ./.github/workflows/workflow_linux.yml
    with:
      baseline_only: true

  macos:
    name: macOS Build
    uses: ./.github/workflows/workflow_macos.yml
    with:
      baseline_only: true

  windows:
    name: Windows Build
    uses: ./.github/workflows/workflow_windows.yml
    with:
      baseline_only: true

  required:
    name: Required checks
    needs: [scan, linux, macos, windows]
    if: always()
    runs-on: ubuntu-24.04
    env:
      SCAN: ${{ needs.scan.result }}
      LINUX: ${{ needs.linux.result }}
      MACOS: ${{ needs.macos.result }}
      WINDOWS: ${{ needs.windows.result }}
    steps:
      - name: Verify all baseline checks passed
        run: |
          printf 'No PII: %s\nLinux: %s\nmacOS: %s\nWindows: %s\n' \
            "$SCAN" "$LINUX" "$MACOS" "$WINDOWS"
          [[ "$SCAN" == success && "$LINUX" == success &&
             "$MACOS" == success && "$WINDOWS" == success ]]
