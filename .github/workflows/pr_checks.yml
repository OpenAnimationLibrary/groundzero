name: PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: No PII
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/no_pii.yml # zizmor: ignore[self-repository]

  linux:
    name: Linux Build
    uses: ./.github/workflows/workflow_linux.yml # zizmor: ignore[self-repository]

  macos:
    name: macOS Build
    uses: ./.github/workflows/workflow_macos.yml # zizmor: ignore[self-repository]

  windows:
    name: Windows Build
    uses: ./.github/workflows/workflow_windows.yml # zizmor: ignore[self-repository]

  required:
    name: Required checks
    needs: [scan, linux, macos, windows]
    if: always()
    runs-on: ubuntu-24.04
    env:
      SCAN: ${{ needs.scan.result }}
      LINUX: ${{ needs.linux.result }}
      MACOS: ${{ needs.macos.result }}
      WINDOWS: ${{ needs.windows.result }}
    steps:
      - name: Verify all baseline checks passed
        run: |
          printf 'No PII: %s\nLinux: %s\nmacOS: %s\nWindows: %s\n' \
            "$SCAN" "$LINUX" "$MACOS" "$WINDOWS"
          [[ "$SCAN" == success && "$LINUX" == success &&
             "$MACOS" == success && "$WINDOWS" == success ]]

  scope:
    name: Select optional checks
    needs: required
    runs-on: ubuntu-24.04
    continue-on-error: true
    outputs:
      neural: ${{ steps.paths.outputs.neural }}
      seexpr: ${{ steps.paths.outputs.seexpr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          lfs: false
          persist-credentials: false
      - name: Select qualification for changed files
        id: paths
        shell: bash
        run: |
          neural=none
          seexpr=none
          # Compare the test merge commit to its first parent, the PR base.
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/pr-paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/pr_checks.yml|.github/workflows/neural-style.yml|\
              .github/workflows/build_release.yml|.github/workflows/seexpr-package-smoke.yml|\
              .github/workflows/workflow_linux.yml|.github/workflows/workflow_macos.yml|\
              .github/workflows/workflow_windows.yml|ci-scripts/neural-style/*|\
              toonz/sources/CMakeLists.txt|toonz/sources/neuralstyle/*|\
              toonz/sources/toonzlib/neuralstyle.cpp)
                neural=full ;;
              ci-scripts/tests/test_neural_download.py|*neuralstyle*|*neuralStyle*|*neuraltemporal*)
                if [[ "$neural" == none ]]; then neural=smoke; fi ;;
            esac
            case "$path" in
              .github/workflows/pr_checks.yml|.github/workflows/seexpr*.yml|\
              ci-scripts/seexpr/*|stuff/doc/LICENSE/LICENSE_seexpr.txt|\
              toonz/cmake/*[Ss]e[Ee]xpr*|toonz/sources/CMakeLists.txt|\
              toonz/sources/common/expressions/*|toonz/sources/seexprpython/*|\
              toonz/sources/seexprsdk/*|toonz/sources/include/tseexpr*.h)
                seexpr=full ;;
              *seexpr*|toonz/sources/common/tfx/*|toonz/sources/common/tparam/*|\
              toonz/sources/toonzlib/tstageobject*|toonz/sources/include/toonz/tstageobject*|\
              toonz/sources/include/tparam*.h|toonz/sources/include/tfx*.h)
                if [[ "$seexpr" == none ]]; then seexpr=smoke; fi ;;
            esac
          done < "$RUNNER_TEMP/pr-paths"
          printf 'Neural Style: %s\nSeExpr: %s\n' "$neural" "$seexpr"
          printf 'neural=%s\nseexpr=%s\n' "$neural" "$seexpr" >> "$GITHUB_OUTPUT"

  neural:
    name: Optional Neural Style
    needs: scope
    if: needs.scope.outputs.neural == 'smoke' || needs.scope.outputs.neural == 'full'
    uses: ./.github/workflows/neural-style.yml # zizmor: ignore[self-repository]
    with:
      smoke_only: ${{ needs.scope.outputs.neural == 'smoke' }}

  seexpr:
    name: Optional SeExpr
    needs: scope
    if: needs.scope.outputs.seexpr == 'smoke' || needs.scope.outputs.seexpr == 'full'
    uses: ./.github/workflows/seexpr.yml # zizmor: ignore[self-repository]
    with:
      smoke_only: ${{ needs.scope.outputs.seexpr == 'smoke' }}
