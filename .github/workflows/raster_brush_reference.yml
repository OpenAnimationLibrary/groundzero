name: Raster Brush Reference
on:
  pull_request:
    paths:
      - 'ci-scripts/brush-reference/**'
      - 'ci-scripts/brush-parser/**'
      - 'toonz/sources/include/toonz/rasterbrush*'
      - 'toonz/sources/toonzlib/rasterbrush*'
      - '.github/workflows/raster_brush_reference.yml'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Diagnostic subset; only all qualifies the full source matrix'
        type: choice
        default: all
        options:
          - all
          - wet-interactions
          - wet-drift
          - wet-color
          - pixel-input
          - hsv-interactions
          - masked-timed
          - resources
permissions:
  contents: read
concurrency:
  group: brush-reference-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.focus || 'all' }}
  # Independent manual groups can run together; the full PR matrix stays intact.
  # Preserve running source acquisitions when an unrelated platform fix lands.
  # Complete content-addressed source captures may be reused; every new head
  # still builds and runs its own complete candidate comparison matrix.
  cancel-in-progress: false
jobs:
  oracle-cache-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Reject corrupt, stale, incomplete and unsafe source caches
        run: |
          python3 ci-scripts/brush-reference/oracle_cache_test.py
          python3 ci-scripts/brush-reference/hsv_joint_test.py
          python3 ci-scripts/brush-reference/wet_drift_contract_test.py
          python3 ci-scripts/brush-reference/kernel_precision_probe_test.py
          python3 ci-scripts/brush-reference/gih_cadence_test.py
          python3 ci-scripts/brush-reference/paced_policy_test.py
  native-metrics:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Build benchmark
        shell: bash
        run: |
          set -o pipefail
          cmake -S ci-scripts/brush-parser -B brush-metrics-build -DCMAKE_BUILD_TYPE=Release
          cmake --build brush-metrics-build --target rasterbrushbenchmark rasterbrushpreset_test --parallel 2 2>&1 | tee brush-metrics-build.log
      - name: Measure original native traces
        run: |
          lscpu > brush-metrics-machine.txt
          metric_status=0
          /usr/bin/time -v -o brush-metrics-memory.txt timeout 300 brush-metrics-build/rasterbrushbenchmark brush-metrics.json || metric_status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('brush-metrics.json').read_text())
          for row in result['records']:
              print('::notice title=Native brush measurement::' + json.dumps(row))
          PY
          if [ "$metric_status" -ne 0 ]; then
            echo "::error::Native benchmark exited with status $metric_status"
            exit "$metric_status"
          fi
      - name: Qualify hostile multi-package import peak memory
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o brush-import-peak-memory.txt timeout 60 brush-metrics-build/rasterbrushpreset_test --test-worker-budget 2>&1 | tee brush-import-budget.log
      - name: Report import memory failure
        if: failure()
        run: |
          python3 - <<'PYBUDGET'
          from pathlib import Path
          for name in ('brush-import-budget.log', 'brush-import-peak-memory.txt'):
              path = Path(name)
              if path.is_file():
                  message = path.read_text(errors='replace')[-3500:]
                  print('::error title=' + name + '::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYBUDGET
      - name: Report metric failure
        if: failure()
        shell: bash
        run: |
          echo '::error::Native brush metrics failed; inspect build and memory artifacts.'
          if test -f brush-metrics-build.log; then
            tail -30 brush-metrics-build.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              echo "::error::$line"
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-brush-metrics-${{ github.sha }}
          path: |
            brush-metrics.json
            brush-metrics-machine.txt
            brush-metrics-memory.txt
            brush-metrics-build.log
            brush-import-peak-memory.txt
            brush-import-budget.log
  krita:
    needs: oracle-cache-validation
    strategy:
      # Bound full-application reference runs independently of parser CI.
      # Every matrix member still runs; one mismatch cannot cancel peers.
      max-parallel: 4
      fail-fast: false
      matrix:
        # Pull requests always run every declared source group. Manual subsets
        # shorten diagnostics without representing full source qualification.
        fixture_group: ${{ github.event_name == 'workflow_dispatch' && inputs.focus == 'wet-drift' && fromJSON('["wetdrift"]') || github.event_name == 'workflow_dispatch' && inputs.focus == 'wet-color' && fromJSON('["wetdrift","wethsv","texturepickup","wetkernelcount","hsvorder","hsvheldout"]') || github.event_name == 'workflow_dispatch' && inputs.focus == 'wet-interactions' && fromJSON('["wetdrift","wethsv","texturepickup","wetkernelcount"]') || github.event_name == 'workflow_dispatch' && inputs.focus == 'pixel-input' && fromJSON('["pixelprecision","tabletsensors","pixelpressure","pixelsmallpressure","pixeltransfer","hsvpressure"]') || github.event_name == 'workflow_dispatch' && inputs.focus == 'hsv-interactions' && fromJSON('["hsvpressure","hsvchroma","hsvorder","hsvjoint","hsvheldout","hsvdynamics"]') || github.event_name == 'workflow_dispatch' && inputs.focus == 'masked-timed' && fromJSON('["maskwash","maskbuildup","airbrushtimed","timedsensors"]') || github.event_name == 'workflow_dispatch' && inputs.focus == 'resources' && fromJSON('["bitmaptips","mirrortips","gihlabels","gihstatistics","gihcadence"]') || fromJSON('["wetdrift","wethsv","texturepickup","wetkernelcount","hsvorder","hsvpressure","hsvchroma","pixelprecision","tabletsensors","hsvjoint","hsvheldout","airbrushtimed","timedsensors","maskwash","maskbuildup","hsvdynamics","distancesensors","mirrortips","spacingdynamics","bitmaptips","gihlabels","gihstatistics","gihcadence","pixelcurveknots","texturestate","pixeltransfer","wetboundary","texturemasks","pixelblend","wetopacitycombo","wettransfer","pixelcurves","wetkernelscale","wetkernel","wettexture3","wetpressure","pixelsoftsize","pixelrectsize","pixelsoft","pixelopacitytablet","pixelopacity","pixelpressure","wetstate","wethold","wettexture","pixelaarange","pixelcontrols","pixelsmallpressure","pixelshape","wetswitches","wetcombined","wetsteps","hardpixel","geometry","tablet","parameters"]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      BRUSH_REFERENCE_GROUP: ${{ matrix.fixture_group }}
      BRUSH_REFERENCE_ROOT: ${{ github.workspace }}/brush-reference-run
    steps:
      - uses: actions/checkout@v6
      - name: Install reference runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb fontconfig fonts-dejavu-core libopengl0 libegl1 libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Download pinned official reference application
        shell: bash
        run: |
          mkdir -p reference-runtime
          curl --fail --location --retry 3 --max-time 300 'https://download.kde.org/stable/krita/5.3.4.1/krita-5.3.4.1-x86_64.AppImage' -o reference-runtime/krita.AppImage
          sha256sum reference-runtime/krita.AppImage > reference-runtime/application-sha256.txt
          chmod +x reference-runtime/krita.AppImage
          cd reference-runtime
          ./krita.AppImage --appimage-extract > extraction.log
      - name: Configure bundled reference Python
        shell: bash
        run: |
          python3 - <<'PYTHONPATHS'
          import os, shlex, zipfile
          from pathlib import Path
          runtime = Path('reference-runtime/squashfs-root').resolve()
          prefix = runtime / 'usr'
          libraries = []
          for candidate in sorted((prefix / 'lib').glob('python*')):
              if candidate.is_dir() and (candidate / 'encodings' / '__init__.py').is_file():
                  libraries.extend([candidate, candidate / 'lib-dynload'])
              elif candidate.suffix == '.zip' and zipfile.is_zipfile(candidate):
                  with zipfile.ZipFile(candidate) as archive:
                      if 'encodings/__init__.py' in archive.namelist():
                          libraries.append(candidate)
          if not libraries:
              print('::error::Official AppImage has no discoverable bundled Python standard library')
              for path in runtime.rglob('*encodings*'):
                  print('::notice::Bundled Python candidate: ' + str(path.relative_to(runtime)))
              raise SystemExit(1)
          with open('reference-runtime/python.env', 'a') as environment:
              environment.write('export PYTHONHOME=' + shlex.quote(str(prefix)) + '\n')
              environment.write('export PYTHONPATH=' + shlex.quote(os.pathsep.join(map(str, libraries))) + '\n')
          print('::notice::Using reference-bundled Python libraries: ' + ', '.join(str(p.relative_to(runtime)) for p in libraries))
          PYTHONPATHS
      - name: Prepare original brush fixtures
        run: python3 ci-scripts/brush-reference/prepare.py
      - name: Identify exact source acquisition inputs
        id: source-key
        run: python3 ci-scripts/brush-reference/oracle_cache.py identity
      - uses: actions/cache/restore@v4
        id: source-cache
        continue-on-error: true
        with:
          path: .brush-source-cache
          key: ${{ steps.source-key.outputs.key }}
      - name: Validate cached original source acquisition
        id: source-reuse
        run: python3 ci-scripts/brush-reference/oracle_cache.py restore
      - name: Render source application fixtures
        if: steps.source-reuse.outputs.validated != 'true'
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="$BRUSH_REFERENCE_ROOT/data"
          export XDG_CONFIG_HOME="$BRUSH_REFERENCE_ROOT/config"
          export QT_X11_NO_MITSHM=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_LOGGING_RULES='krita.scripting=true;krita.python=true;krita.resources=true'
          # The AppImage's bundled fontconfig otherwise searches a nonexistent
          # build-time configuration path on the hosted runner.
          export FONTCONFIG_FILE=/etc/fonts/fonts.conf
          export FONTCONFIG_PATH=/etc/fonts
          source reference-runtime/python.env
          xvfb-run -a reference-runtime/squashfs-root/AppRun --version 2>&1 | tee "$BRUSH_REFERENCE_ROOT/version.log"
          set +e
          timeout 600 xvfb-run -a -s '-screen 0 2560x2160x24' reference-runtime/squashfs-root/AppRun --nosplash 2>&1 | tee "$BRUSH_REFERENCE_ROOT/runtime.log"
          runtime_status=${PIPESTATUS[0]}
          set -e
          if test "$runtime_status" -ne 0; then
            echo "::error::Reference application exited with status $runtime_status"
          fi
          env -u PYTHONHOME -u PYTHONPATH python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['BRUSH_REFERENCE_ROOT']) / 'output' / 'oracle-status.json'
          if not path.exists():
              raise SystemExit('::error::Reference plugin produced no status; inspect runtime exit and startup log')
          result = json.loads(path.read_text())
          fixtures = json.loads((path.parent / 'fixtures.json').read_text())
          expected = fixtures['presets']
          actual = [record['preset'] for record in result['records']]
          if result['status'] != 'complete' or actual != expected or len(set(actual)) != len(expected):
              raise SystemExit('Incomplete source reference workload: ' + str(result))
          PY
          test "$runtime_status" -eq 0
      # Save independent source facts even if a later current-head candidate
      # comparison fails. No candidate files or qualification are cached.
      - name: Seal complete source acquisition
        if: steps.source-reuse.outputs.validated != 'true'
        run: python3 ci-scripts/brush-reference/oracle_cache.py seal
      - uses: actions/cache/save@v4
        if: steps.source-reuse.outputs.validated != 'true'
        continue-on-error: true
        with:
          path: .brush-source-cache
          key: ${{ steps.source-key.outputs.key }}
      - name: Report source parameter probes
        if: always()
        run: |
          python3 - <<'PYPROBES'
          import json, os
          from pathlib import Path
          path = Path(os.environ['BRUSH_REFERENCE_ROOT']) / 'output' / 'oracle-status.json'
          if path.is_file():
              result = json.loads(path.read_text())
              probes = []
              for row in result.get('records', []):
                  probe = {key: row.get(key) for key in ('preset', 'changed', 'effectivePresetSha256')}
                  view = row.get('effectiveView', {})
                  probe['view'] = [view.get(key) for key in ('diameter', 'opacity', 'flow')]
                  controls = row.get('effectiveWetControls', {})
                  probe['paintOpAction'] = controls.get('PaintOpAction')
                  if os.environ['BRUSH_REFERENCE_GROUP'] == 'wetkernelcount':
                      geometry = row.get('effectiveKernelGeometry') or {}
                      probe['kernel'] = {key: geometry.get(key) for key in ('serializedDiameter', 'serializedRadius', 'serializedRatio', 'serializedAngle', 'serializedSpacing')}
                      probe['delivery'] = row.get('deliveryReport', {}).get('events')
                      probe['candidateGate'] = row.get('sourceCandidateGate')
                  if os.environ['BRUSH_REFERENCE_GROUP'] in ('wettransfer', 'wetopacitycombo'):
                      probe['transfer'] = [controls.get(key) for key in ('PressureColorRate', 'ColorRateUseCurve', 'PressureOpacity', 'OpacityUseCurve', 'PressureFlow', 'FlowUseCurve')]
                  if os.environ['BRUSH_REFERENCE_GROUP'] == 'pixelcurveknots':
                      probe['sizeCurve'] = row.get('effectiveSizeCurveControls')
                      probe['delivery'] = row.get('deliveryReport', {}).get('events')
                  if os.environ['BRUSH_REFERENCE_GROUP'] in ('pixeltransfer', 'pixelprecision'):
                      report = row.get('deliveryReport', {})
                      probe['input'] = row.get('input')
                      probe['sizeCurve'] = row.get('effectiveSizeCurveControls')
                      probe['pressureStates'] = {phase: {key: report[phase].get(key) for key in ('disablePressure', 'pressureControls')}
                          for phase in ('stateBeforeProximity', 'stateAfterProximity', 'stateBeforeContact') if phase in report}
                      events = report.get('events', [])
                      probe['device'] = [{key: event.get(key) for key in ('device', 'pointerType', 'uniqueId', 'pressure')}
                          for event in events if event.get('type') == 92][:1]
                  if row.get('startStateProbe'):
                      probe['startStatePixels'] = row.get('deliveryReport', {}).get('startStatePixels')
                  if row.get('boundaryProbe') or row.get('pressureShortProbe') or row.get('startStateProbe'):
                      probe['boundary'] = row.get('boundaryProbe')
                      probe['shortPath'] = row.get('pressureShortProbe')
                      probe['delivery'] = [{key: event.get(key) for key in ('type', 'local', 'image', 'authoredImage', 'pressure')}
                          for event in row.get('deliveryReport', {}).get('events', []) if event.get('type') in (87, 92, 93)]
                  if os.environ['BRUSH_REFERENCE_GROUP'] == 'pixeltransfer':
                      probe['transfer'] = row.get('effectivePixelTransferControls')
                      probe['input'] = row.get('input')
                      probe['eventCount'] = len(row.get('deliveryReport', {}).get('events', []))
                  if os.environ['BRUSH_REFERENCE_GROUP'] in ('texturemasks', 'texturestate', 'texturepickup'):
                      texture = row.get('effectiveTextureControls', {})
                      probe['texture'] = [texture.get(key) for key in ('Texture/Pattern/TexturingMode', 'Texture/Pattern/UseSoftTexturing', 'Texture/Pattern/Invert', 'Texture/Strength/Value', 'PressureTexture/Strength/', 'Texture/Strength/UseCurve')]
                  if row.get('driftEvidence') is not None:
                      probe['driftEvidence'] = row['driftEvidence']
                  probe['wet'] = [controls.get(key) for key in ('SmudgeRateValue', 'ColorRateValue', 'SmudgeRadiusValue', 'PressureSmudgeRate', 'SmudgeRateUseNewEngine', 'SmudgeRateMode', 'SmudgeRateSmearAlpha')]
                  positions = row.get('probePositions', (256, 416, 576)) if row.get('background') == 'wet-halves' or os.environ['BRUSH_REFERENCE_GROUP'] in ('texturemasks', 'texturestate', 'texturepickup') else (256, 384, 512, 640, 768, 896, 1024, 1152)
                  probe['centerlineRGBA8'] = [sample for sample in row.get('centerlineRGBA8', []) if sample[0] in positions]
                  probes.append(probe)
              import runpy
              report_records = runpy.run_path('ci-scripts/brush-reference/annotations.py')['report_records']
              report_records('Source parameter probes; not parity', probes)
          PYPROBES
      - name: Report kernel precision research diagnostics
        if: always() && matrix.fixture_group == 'wetkernelcount'
        run: |
          python3 - <<'PYPRECISION'
          import json, os, runpy
          from pathlib import Path
          path = Path(os.environ['BRUSH_REFERENCE_ROOT']) / 'output' / 'kernel-precision.json'
          if path.is_file():
              report_records = runpy.run_path('ci-scripts/brush-reference/annotations.py')['report_records']
              records = []
              for row in json.loads(path.read_text()).get('records', []):
                  records.append({key: value for key, value in row.items() if key != 'data'})
                  for offset in range(0, len(row['data']), 1800):
                      records.append({'id': row['id'], 'capture': 'kernel-precision-raw',
                          'offset': offset, 'total': len(row['data']), 'data': row['data'][offset:offset + 1800]})
              report_records('Kernel precision research; not parity', records)
          PYPRECISION
      - name: Report bundled public setting metadata
        if: always()
        run: |
          python3 - <<'PYSETTINGS'
          import json, os
          from pathlib import Path
          path = Path(os.environ['BRUSH_REFERENCE_ROOT']) / 'output' / 'bundled-settings.json'
          if path.is_file():
              for row in json.loads(path.read_text()):
                  text = json.dumps(row, separators=(',', ':'))
                  if len(text.encode()) > 3900:
                      raise RuntimeError('Setting metadata exceeds annotation limit')
                  print('::notice title=Public bundled setting metadata::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYSETTINGS
      - name: Report bounded bitmap pixel readback
        if: always() && matrix.fixture_group == 'bitmaptips'
        run: |
          python3 - <<'PYBITMAP'
          import json, os, runpy
          from pathlib import Path
          path = Path(os.environ['BRUSH_REFERENCE_ROOT']) / 'output' / 'oracle-status.json'
          if path.is_file():
              records = []
              for row in json.loads(path.read_text()).get('records', []):
                  capture = row.get('resourceReadback')
                  if capture is None:
                      continue
                  data = capture.get('data', '')
                  if not isinstance(data, str) or len(data) > 200000:
                      raise RuntimeError('Bitmap readback exceeds diagnostic bound')
                  records.append({'preset': row['preset'], **{key: value for key, value in capture.items() if key != 'data'}})
                  for offset in range(0, len(data), 1800):
                      records.append({'preset': row['preset'], 'capture': 'bitmap-bgra',
                          'offset': offset, 'total': len(data), 'data': data[offset:offset + 1800]})
              runpy.run_path('ci-scripts/brush-reference/annotations.py')['report_records'](
                  'Bitmap pixel research; not parity', records)
          PYBITMAP
      - name: Report exact short-stroke alpha probes
        if: always()
        run: |
          python3 - <<'PYGEOMETRY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['BRUSH_REFERENCE_ROOT']) / 'output' / 'oracle-status.json'
          if path.is_file():
              probes = [{'preset': row['preset'], **row['geometryProbe']} for row in json.loads(path.read_text()).get('records', []) if row.get('geometryProbe') is not None]
              probes.extend({'preset': row['preset'] + ' outside document', **row['boundaryOutsideProbe']} for row in json.loads(path.read_text()).get('records', []) if row.get('boundaryOutsideProbe') is not None)
              import runpy
              report_records = runpy.run_path('ci-scripts/brush-reference/annotations.py')['report_records']
              report_records('Exact source alpha probe; not parity', probes)
          PYGEOMETRY
      - name: Report reference failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYREPORT'
          import os
          from pathlib import Path
          root = Path(os.environ['BRUSH_REFERENCE_ROOT'])
          import re
          for name in ('version.log', 'output/oracle-status.json', 'output/repeat-failure.json', 'output/controls-failure.json', 'output/plugin-startup.log', 'output/progress.log', 'output/python-stacks.log', 'runtime.log', 'data/krita/krita.log', 'data/krita/krita-sysinfo.log'):
              path = root / name
              if not path.is_file():
                  print('::notice::Reference diagnostic absent: ' + name)
                  continue
              lines = path.read_text(errors='replace').splitlines()
              relevant = [line for line in lines if re.search(r'error|exception|fail|critical|traceback|python|pykrita|5\.3\.', line, re.I)]
              message = ('\n'.join(relevant)[-1800:] + '\n--- final output ---\n' + '\n'.join(lines[-20:])[-1600:])
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=' + name + '::' + message)
          PYREPORT
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Build and measure native conversion differences
        shell: bash
        run: |
          set -o pipefail
          cmake -S ci-scripts/brush-parser -B brush-comparison-build -DCMAKE_BUILD_TYPE=Release
          cmake --build brush-comparison-build --target rasterbrushreference --parallel 2 2>&1 | tee "$BRUSH_REFERENCE_ROOT/comparison-build.log"
          brush-comparison-build/rasterbrushreference "$BRUSH_REFERENCE_ROOT" 2>&1 | tee "$BRUSH_REFERENCE_ROOT/comparison.log"
      - name: Verify stochastic analysis and enforce GIH statistical gates
        if: matrix.fixture_group == 'gihstatistics' || matrix.fixture_group == 'gihlabels'
        run: |
          python3 ci-scripts/brush-reference/test_stochastic_gate.py
          python3 ci-scripts/brush-reference/stochastic_gate.py "$BRUSH_REFERENCE_ROOT"
      - name: Report conversion measurements
        if: always()
        run: |
          python3 - <<'PYMETRICS'
          import json, os
          from pathlib import Path
          path = Path(os.environ['BRUSH_REFERENCE_ROOT']) / 'output' / 'comparison.json'
          if not path.is_file():
              print('No comparison report; inspect the preceding source/build failure.')
              raise SystemExit(0)
          report = json.loads(path.read_text())
          keys = ('preset', 'premultipliedRGBMAE', 'alphaMAE', 'alphaP99', 'changedPixelIoU', 'visibleChangedPixelIoU', 'referenceBounds', 'candidateBounds', 'deltaE00BlackMean', 'deltaE00WhiteMean', 'sourceReferenceVerified', 'sourceSemanticallySupported')
          measurements = [{key: round(row[key], 8) if isinstance(row[key], float) else row[key] for key in keys} for row in report['records']]
          for row, measurement in zip(report['records'], measurements):
              if 'hardPixelCandidatePassed' in row:
                  measurement['hardGate'] = row['hardPixelCandidatePassed']
                  measurement['alphaIoU'] = round(row['alphaCoverageIoU'], 8)
              if 'wetCandidatePassed' in row:
                  measurement['wetGate'] = row['wetCandidatePassed']
                  measurement['maxRGB'] = round(row['maxRGBError'], 8)
                  measurement['maxAlpha'] = round(row['maxAlphaError'], 8)
          import runpy
          report_records = runpy.run_path('ci-scripts/brush-reference/annotations.py')['report_records']
          report_records('Unqualified conversion measurements', measurements)
          PYMETRICS
      - name: Report comparison failure evidence
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYFAILURE'
          import os, re
          from pathlib import Path
          root = Path(os.environ['BRUSH_REFERENCE_ROOT'])
          build = root / 'comparison-build.log'
          if build.is_file():
              lines = build.read_text(errors='replace').splitlines()
              errors = [line for line in lines if re.search(r'error:|fatal error:|undefined reference|CMake Error|FAILED:|error C[0-9]', line)]
              # Successful compiler progress is context, never an error.
              level = 'error' if errors else 'notice'
              message = '\n'.join(errors[-12:] if errors else lines[-3:])[-3500:]
              print(f'::{level} title=Comparison build evidence::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          runtime = root / 'comparison.log'
          if runtime.is_file():
              message = runtime.read_text(errors='replace')[-3500:]
              print('::notice title=Comparison runtime context::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYFAILURE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krita-reference-${{ matrix.fixture_group }}-${{ github.sha }}
          path: |
            brush-reference-run/output/
            brush-reference-run/data/krita/paintoppresets/
            brush-reference-run/runtime.log
            brush-reference-run/version.log
            brush-reference-run/comparison*.log
            brush-reference-run/data/krita/*.log
            reference-runtime/application-sha256.txt
            reference-runtime/oracle-identity.json
            .brush-source-cache/manifest.json
