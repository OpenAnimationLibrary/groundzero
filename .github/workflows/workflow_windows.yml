name: Windows Build

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

on:
  pull_request:
  push:
    branches:
      - main
      - edition
    paths:
      - '**/*'                                    # Include all files in the repository
      - '!appveyor.yml'                           # Ignore changes in AppVeyor
      - '!README.md'                              # Exclude README
      - '!doc/**'                                 # Exclude documentation
      - '!**/.github/**'                          # Exclude everything in .github folder
      - '.github/workflows/workflow_windows.yml'  # Include Windows workflow file
      - '.github/ot-dev/**'                       # Include Groundzero build branding assets
  workflow_dispatch:
    inputs:
      benchmark_bundle:
        description: Prepare an immutable scene benchmark bundle after validation
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  RecorderEncoder:
    if: github.repository == 'OpenAnimationLibrary/groundzero'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: .github/ot-dev/recorder
      - uses: actions/cache@v5
        id: recorder-cache
        with:
          path: |
            recorder-encoder
            recorder-test-decoder
          key: otdev-recorder-windows-2025-x64-${{ hashFiles('.github/ot-dev/recorder/build-ffmpeg.sh') }}
      - uses: msys2/setup-msys2@v2
        if: steps.recorder-cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            make
            diffutils
            tar
            curl
      - name: Build input-restricted recorder encoder
        if: steps.recorder-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash .github/ot-dev/recorder/build-ffmpeg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Groundzero-recorder-encoder
          path: recorder-encoder
      - uses: actions/upload-artifact@v6
        with:
          name: Groundzero-recorder-test-decoder
          path: recorder-test-decoder

  CadmiumRuntime:
    uses: ./.github/workflows/cadmium_runtime.yml

  Windows:
    needs: [RecorderEncoder, CadmiumRuntime]
    runs-on: windows-2025
    env:
      # QT related variable
      QT_PATH: ${{ github.workspace }}\thirdparty\qt\5.15.2_wintab\msvc2019_64  # Path to custom Qt

      # Visual Studio related variables
      MSVCVERSION: "Visual Studio 18 2026"  # Visual Studio version
      
      # Boost-related variables      
      BOOST_TOOLSET: "14.3"                 # Boost MSVC Toolset version
      BOOST_VERSION: "1.87.0"               # Boost version
      BOOST_ROOT: C:\local\boost_1_87_0     # Path to Boost library root
      
      # OpenCV-related variables      
      OPENCV_VERSION: "4.13.0"              # OpenCV version
      OpenCV_DIR: C:\tools\opencv\build     # Path to OpenCV

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Inject Groundzero recorder (Windows CI only)
        shell: pwsh
        env:
          OTDEV_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python .github/ot-dev/recorder/enable.py --build-id $env:OTDEV_BUILD_ID

      - uses: actions/download-artifact@v6
        with:
          name: Groundzero-recorder-encoder
          path: recorder-encoder
      - uses: actions/download-artifact@v6
        with:
          name: Groundzero-recorder-test-decoder
          path: recorder-test-decoder

      # Cache OpenCV and Boost libraries
      - name: Cache OpenCV and Boost
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            C:\tools\opencv
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-${{ env.BOOST_VERSION }}
          restore-keys: |
            ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-

      # Install OpenCV and Boost if the cache is missing
      - name: Install OpenCV and Boost if cache is missing
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          @echo on
          choco install opencv --version=${{ env.OPENCV_VERSION }} -y
          choco install boost-msvc-${{ env.BOOST_TOOLSET }} --version=${{ env.BOOST_VERSION }} -y
        shell: cmd

      # Public image-I/O tests use a full FFmpeg distribution and ffprobe.
      - name: Install FFmpeg export test tools if absent
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          }
          Get-Command ffmpeg, ffprobe -ErrorAction Stop

      - name: Install custom Qt 5.15.2 with WinTab support
        run: |
          @echo on
          mkdir thirdparty\qt
          curl -fsSL -o Qt5.15.2_wintab.zip https://github.com/shun-iwasawa/qt5/releases/download/v5.15.2_wintab/Qt5.15.2_wintab.zip
          7z x Qt5.15.2_wintab.zip
          move Qt5.15.2_wintab\5.15.2_wintab thirdparty\qt
        shell: cmd

      - name: Install third-party prebuilt libs (LFS workaround)
        run: |
          @echo on
          curl -fsSL -o thirdparty-libs.zip https://github.com/andeon/opentoonz-thirdparty-libs/releases/download/prebuilt-libs-v1/thirdparty-libs.zip
          7z x -y thirdparty-libs.zip
        shell: cmd    

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install SeExpr parser tools
        shell: pwsh
        run: ./ci-scripts/seexpr/install_parser_windows.ps1

      - name: Prepare software OpenGL for native SeExpr acceptance
        timeout-minutes: 5
        shell: pwsh
        run: ./ci-scripts/seexpr/install_mesa_windows.ps1

      # Add msbuild to PATH for build process
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      # CMake configuration step
      - name: CMake configuration
        id: seexpr_configure
        run: |
          @echo on
          cd thirdparty
          copy /Y tiff-4.0.3\libtiff\tif_config.vc.h tiff-4.0.3\libtiff\tif_config.h
          copy /Y tiff-4.0.3\libtiff\tiffconf.vc.h tiff-4.0.3\libtiff\tiffconf.h
          copy /Y libpng-1.6.21\scripts\pnglibconf.h.prebuilt libpng-1.6.21\pnglibconf.h

          cd ../toonz
          rmdir /S /Q build
          mkdir build
          cd build

          cmake ..\sources -G "%MSVCVERSION%" -Ax64 -DQT_PATH="%QT_PATH%" -DBOOST_ROOT="%BOOST_ROOT%" -DOpenCV_DIR="%OpenCV_DIR%" -DWITH_WINTAB=Y -DBUILD_CELFX_TESTS=ON -DBUILD_CADMIUM_TESTS=ON -DBUILD_RELIABILITY_TESTS=ON -DBUILD_STREAM_TESTS=ON -DBUILD_SCENEBENCH_TESTS=ON -DBUILD_FXRENDER_TESTS=ON -DBUILD_PSD_TESTS=ON -DBUILD_FFMPEG_TESTS=ON -DBUILD_SEEXPR_TESTS=ON -DBUILD_SEEXPR_PYTHON=ON -DPython3_EXECUTABLE="%pythonLocation%\python.exe" > cmake-output.log 2>&1
          set "SEEXPR_CONFIGURE_EXIT=%ERRORLEVEL%"
          type cmake-output.log
          exit /b %SEEXPR_CONFIGURE_EXIT%
        shell: cmd

      - name: Report SeExpr configuration failure
        if: ${{ failure() && steps.seexpr_configure.outcome == 'failure' }}
        run: python ci-scripts/seexpr/report.py toonz/build/cmake-output.log

      # Build Opentoonz using MSBuild
      - name: Build Opentoonz
        run: |
          @echo on
          cd toonz\build
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal "/flp:logfile=msbuild-errors.log;errorsonly" ALL_BUILD.vcxproj
        shell: cmd

      - name: Verify benchmark harness contracts
        run: python -m unittest discover -s ci-scripts/tests -p test_paired_benchmark.py

      # Show the compile and link errors on the run (annotations), since the
      # full log is not always reachable
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          log=toonz/build/msbuild-errors.log
          [ -f "$log" ] || exit 0
          sort -u "$log" | grep -E ': (fatal )?error ' | head -60 > errors.txt || true
          echo "::notice title=Windows build::$(wc -l < errors.txt) distinct errors"
          all=$(sed -e 's/%/%25/g' errors.txt | sed -e 's/\r//' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$all" ] && echo "::error title=Windows build errors::${all}"
          head -10 errors.txt | while IFS= read -r line; do echo "::error::${line}"; done

      # Create the package
      - name: Create Package
        id: package
        run: |
          @echo on
          cd toonz\build
          
          REM Create Opentoonz directory and copy files from RelWithDebInfo
          mkdir Opentoonz
          copy /Y RelWithDebInfo\*.* Opentoonz\
          REM Copy required DLLs for proper functionality
          copy /Y ..\..\thirdparty\glut\3.7.6\lib\glut64.dll Opentoonz
          copy /Y ..\..\thirdparty\glew\glew-1.9.0\bin\64bit\glew32.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libiconv-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libintl-8.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libjson-c-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libmypaint-1-4-0.dll Opentoonz
          
          REM Copy OpenCV DLL (IMPORTANT: Update path/filename when upgrading OpenCV version)
          copy /Y "C:\tools\opencv\build\x64\vc16\bin\opencv_world4130.dll" Opentoonz
          
          REM Deploy Qt dependencies
          "%QT_PATH%\bin\windeployqt.exe" Opentoonz\Opentoonz.exe --opengl

          del /Q Opentoonz\*.pdb  REM Remove .pdb files
          del /Q Opentoonz\vc_redist.x64.exe REM Remove vc_redist.x64.exe file
          
          REM Create portablestuff directory and copy stuff folder
          mkdir Opentoonz\portablestuff
          xcopy /Y /E /I ..\..\stuff .\Opentoonz\portablestuff
          REM The optional inspection SDK uses the separately installed Python.
          xcopy /Y /E /I seexpr-python Opentoonz\sdk\python
          copy /Y ..\..\stuff\doc\LICENSE\LICENSE_seexpr.txt Opentoonz\sdk\python\LICENSE_seexpr.txt
        shell: cmd

      - name: Install optional Cadmium worker
        uses: actions/download-artifact@v6
        with:
          name: cadmium-runtime-windows-x64
          path: toonz/build/Opentoonz

      - name: Test cel effects
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          set "QT_DEBUG_PLUGINS=1"
          cd toonz\build
          ctest -C RelWithDebInfo --output-on-failure --output-junit cel-tests.xml --no-tests=error -R "^celfx_" > cel-tests-output.txt 2>&1
          set "CEL_TEST_EXIT=%ERRORLEVEL%"
          type cel-tests-output.txt
          exit /b %CEL_TEST_EXIT%

      - name: Test Cadmium adapters
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          cd toonz\build
          ctest -C RelWithDebInfo --output-on-failure --no-tests=error -R "^cadmium_"

      - name: Test SeExpr native integration
        id: seexpr_tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          set "QT_QPA_FONTDIR=%WINDIR%\Fonts"
          cd toonz\build
          ctest -C RelWithDebInfo --output-on-failure --output-junit seexpr-tests.xml --no-tests=error --timeout 180 -R "^seexpr_" > seexpr-tests-output.txt 2>&1
          set "SEEXPR_TEST_EXIT=%ERRORLEVEL%"
          type seexpr-tests-output.txt
          exit /b %SEEXPR_TEST_EXIT%

      - name: Report SeExpr test failures
        if: ${{ failure() && steps.seexpr_tests.outcome == 'failure' }}
        run: python ci-scripts/seexpr/report.py toonz/build/seexpr-tests-output.txt

      - name: Report native SeExpr crash stack
        if: ${{ failure() && steps.seexpr_tests.outcome == 'failure' }}
        shell: pwsh
        run: |
          $report = "toonz/build/seexpr-native-output-debugger.txt"
          if (Test-Path -LiteralPath $report -PathType Leaf) {
            python ci-scripts/seexpr/report.py $report
          }

      - name: Test reliability and performance invariants
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          cd toonz\build
          python ..\..\ci-scripts\run_regression_tests.py --config RelWithDebInfo rasterallocation timagecache levelselection save_transaction movierenderqueue levelupdater_abort trenderer_startup renderoutputbudget executor_submission compressed_stream scenebench fxrender ffmpeg_public tiio_psd

      - name: Upload reliability diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-reliability-results
          path: |
            toonz/build/reliability-tests.xml
            toonz/build/stdfx/fxrender-output
          if-no-files-found: ignore

      - name: Verify models and exercise native painting pipelines
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          toonz\build\RelWithDebInfo\cadmium_installer_test.exe --download models
          if errorlevel 1 exit /b 1
          toonz\build\RelWithDebInfo\cadmium_pipeline_test.exe "%CD%\toonz\build\Opentoonz\cadmium-sidecar.exe" "%CD%\models"

      - name: Report cel test failures
        if: failure()
        run: python ci-scripts/report_cel_tests.py toonz/build/cel-tests-output.txt

      - name: Add the recorder encoder to the package
        shell: cmd
        run: |
          xcopy /Y /E /I recorder-encoder toonz\build\Opentoonz\otdev-recorder
          copy /Y .github\ot-dev\recorder\README.md toonz\build\Opentoonz\otdev-recorder\README.md

      - name: Verify test-only native artifacts are absent
        shell: pwsh
        run: |
          foreach ($directory in @("toonz/build/RelWithDebInfo", "toonz/build/Opentoonz")) {
            foreach ($name in @("opengl32.dll", "libgallium_wgl.dll", "OpenToonz.exe.local", "tcomposer.exe.local", "SeExprSdkFixture.dll", "SeExprInvalidFixture.dll")) {
              if (Test-Path -LiteralPath (Join-Path $directory $name)) {
                throw "A test-only renderer or SDK fixture remained in the application runtime or package"
              }
            }
          }

      - name: Prepare optional benchmark bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_bundle }}
        shell: pwsh
        run: >-
          python ci-scripts/benchmark_bundle.py --build toonz/build --platform windows
          --configuration RelWithDebInfo --qt-version 5.15.2
          --revision "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID"
          --run-attempt "$env:GITHUB_RUN_ATTEMPT" --output benchmark-input.tar.gz

      - name: Upload optional benchmark bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_bundle }}
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-input-windows
          path: benchmark-input.tar.gz
          compression-level: 0
          if-no-files-found: error

      # Create artifact from the build
      - name: Create Artifact
        run: |
          mkdir artifact
          xcopy toonz\build\Opentoonz artifact\ /E /H /Y
        shell: cmd

      # Upload the generated artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Groundzero-${{ github.event.pull_request.number && format('PR-{0}', github.event.pull_request.number) || 'Branch-build' }}-Windows-${{ github.sha }}-${{ github.run_id }}
          path: artifact
          if-no-files-found: error

