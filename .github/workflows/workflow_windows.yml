name: Windows Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.head_ref != '' }}

on:
  pull_request:
  push:
    branches:
      - main
      - edition
    paths:
      - '**/*'                                    # Include all files in the repository
      - '!appveyor.yml'                           # Ignore changes in AppVeyor
      - '!README.md'                              # Exclude README
      - '!doc/**'                                 # Exclude documentation
      - '!**/.github/**'                          # Exclude everything in .github folder
      - '.github/workflows/workflow_windows.yml'  # Include Windows workflow file
      - '.github/ot-dev/**'                       # Include Groundzero build branding assets
  workflow_dispatch:
    inputs:
      benchmark_bundle:
        description: Prepare an immutable scene benchmark bundle after validation
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  RecorderEncoder:
    if: github.repository == 'OpenAnimationLibrary/groundzero'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: .github/ot-dev/recorder
      - uses: actions/cache@v5
        id: recorder-cache
        with:
          path: |
            recorder-encoder
            recorder-test-decoder
          key: otdev-recorder-windows-2025-x64-${{ hashFiles('.github/ot-dev/recorder/build-ffmpeg.sh') }}
      - uses: msys2/setup-msys2@v2
        if: steps.recorder-cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            make
            diffutils
            tar
            curl
      - name: Build input-restricted recorder encoder
        if: steps.recorder-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash .github/ot-dev/recorder/build-ffmpeg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Groundzero-recorder-encoder
          path: recorder-encoder
      - uses: actions/upload-artifact@v6
        with:
          name: Groundzero-recorder-test-decoder
          path: recorder-test-decoder

  CadmiumRuntime:
    uses: ./.github/workflows/cadmium_runtime.yml

  Windows:
    needs: [RecorderEncoder, CadmiumRuntime]
    runs-on: windows-2025
    env:
      # QT related variable
      QT_PATH: ${{ github.workspace }}\thirdparty\qt\5.15.2_wintab\msvc2019_64  # Path to custom Qt

      # Visual Studio related variables
      MSVCVERSION: "Visual Studio 18 2026"  # Visual Studio version
      
      # Boost-related variables      
      BOOST_TOOLSET: "14.3"                 # Boost MSVC Toolset version
      BOOST_VERSION: "1.87.0"               # Boost version
      BOOST_ROOT: C:\local\boost_1_87_0     # Path to Boost library root
      
      # OpenCV-related variables      
      OPENCV_VERSION: "4.13.0"              # OpenCV version
      OpenCV_DIR: C:\tools\opencv\build     # Path to OpenCV

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false

      - name: Inject Groundzero recorder (Windows CI only)
        shell: pwsh
        env:
          OTDEV_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python .github/ot-dev/recorder/enable.py --build-id $env:OTDEV_BUILD_ID

      - uses: actions/download-artifact@v6
        with:
          name: Groundzero-recorder-encoder
          path: recorder-encoder
      - uses: actions/download-artifact@v6
        with:
          name: Groundzero-recorder-test-decoder
          path: recorder-test-decoder

      # Cache OpenCV and Boost libraries
      - name: Cache OpenCV and Boost
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            C:\tools\opencv
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-${{ env.BOOST_VERSION }}
          restore-keys: |
            ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-

      # Install OpenCV and Boost if the cache is missing
      - name: Install OpenCV and Boost if cache is missing
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          @echo on
          choco install opencv --version=${{ env.OPENCV_VERSION }} -y
          choco install boost-msvc-${{ env.BOOST_TOOLSET }} --version=${{ env.BOOST_VERSION }} -y
        shell: cmd

      # Public image-I/O tests use a full FFmpeg distribution and ffprobe.
      - name: Install FFmpeg export test tools if absent
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install ffmpeg --yes --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) {
                Write-Output "::error title=FFmpeg dependency installation::Chocolatey failed after three attempts; inspect the package-feed response above."
                throw "FFmpeg installation failed"
              }
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          Get-Command ffmpeg, ffprobe -ErrorAction Stop

      - name: Install custom Qt 5.15.2 with WinTab support
        run: |
          @echo on
          mkdir thirdparty\qt
          curl -fsSL -o Qt5.15.2_wintab.zip https://github.com/shun-iwasawa/qt5/releases/download/v5.15.2_wintab/Qt5.15.2_wintab.zip
          7z x Qt5.15.2_wintab.zip
          move Qt5.15.2_wintab\5.15.2_wintab thirdparty\qt
        shell: cmd

      - name: Prepare pinned Mesa renderer for native UI fixture
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "groundzero-native-mesa-26.2.4"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archive = Join-Path $root "mesa3d-26.2.4-release-msvc.7z"
          curl.exe -fSL --retry 2 --retry-delay 2 --max-time 90 -o $archive https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
          if ($LASTEXITCODE -ne 0) { throw "Could not download the pinned native UI renderer" }
          $expected = "351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695"
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw "Native UI renderer archive checksum does not match"
          }
          7z x $archive "x64/opengl32.dll" "x64/libgallium_wgl.dll" "-o$root" -y
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the native UI renderer" }
          $runtime = Join-Path $root "x64"
          foreach ($name in @("opengl32.dll", "libgallium_wgl.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime $name) -PathType Leaf)) {
              throw "The pinned native UI renderer is missing a required DLL"
            }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NATIVE_UI_MESA_RUNTIME=$runtime" -Encoding utf8

      - name: Install third-party prebuilt libs (LFS workaround)
        run: |
          @echo on
          curl -fsSL -o thirdparty-libs.zip https://github.com/andeon/opentoonz-thirdparty-libs/releases/download/prebuilt-libs-v1/thirdparty-libs.zip
          7z x -y thirdparty-libs.zip
        shell: cmd    

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify native diagnostic isolation
        run: python -m unittest discover -s ci-scripts/tests -p test_native_ui_diagnostics.py

      - name: Verify bounded desktop GL launcher
        run: python -m unittest discover -s ci-scripts/tests -p test_windows_gl_test.py -v

      - name: Install SeExpr parser tools
        shell: pwsh
        run: ./ci-scripts/seexpr/install_parser_windows.ps1

      - name: Prepare software OpenGL for native SeExpr acceptance
        timeout-minutes: 5
        shell: pwsh
        run: ./ci-scripts/seexpr/install_mesa_windows.ps1

      # Add msbuild to PATH for build process
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      # CMake configuration step
      - name: CMake configuration
        id: seexpr_configure
        run: |
          @echo on
          cd thirdparty
          copy /Y tiff-4.0.3\libtiff\tif_config.vc.h tiff-4.0.3\libtiff\tif_config.h
          copy /Y tiff-4.0.3\libtiff\tiffconf.vc.h tiff-4.0.3\libtiff\tiffconf.h
          copy /Y libpng-1.6.21\scripts\pnglibconf.h.prebuilt libpng-1.6.21\pnglibconf.h

          cd ../toonz
          rmdir /S /Q build
          mkdir build
          cd build

          cmake ..\sources -G "%MSVCVERSION%" -Ax64 -DQT_PATH="%QT_PATH%" -DBOOST_ROOT="%BOOST_ROOT%" -DOpenCV_DIR="%OpenCV_DIR%" -DWITH_WINTAB=Y -DBUILD_CELFX_TESTS=ON -DBUILD_CADMIUM_TESTS=ON -DBUILD_UI_PORT_TESTS=ON -DBUILD_LUT3D_TESTS=ON -DBUILD_PARTICLE_CACHE_TESTS=ON -DBUILD_RELIABILITY_TESTS=ON -DBUILD_STREAM_TESTS=ON -DBUILD_SCENEBENCH_TESTS=ON -DBUILD_FXRENDER_TESTS=ON -DBUILD_PSD_TESTS=ON -DBUILD_EXR_TESTS=ON -DBUILD_FFMPEG_TESTS=ON -DBUILD_SEEXPR_TESTS=ON -DBUILD_SEEXPR_PYTHON=ON -DPython3_EXECUTABLE="%pythonLocation%\python.exe" > cmake-config.log 2>&1
          set "CONFIGURE_EXIT=%ERRORLEVEL%"
          type cmake-config.log
          exit /b %CONFIGURE_EXIT%
        shell: cmd

      - name: Report SeExpr configuration failure
        if: ${{ failure() && steps.seexpr_configure.outcome == 'failure' }}
        run: python ci-scripts/seexpr/report.py toonz/build/cmake-config.log

      # Qt 5's Windows offscreen plugin uses FreeType without system font
      # discovery. Give image-based UI regressions the installed font directory.
      - name: Configure offscreen fonts
        shell: pwsh
        run: |
          $fontDirectory = Join-Path $env:WINDIR "Fonts"
          if (-not (Test-Path -LiteralPath $fontDirectory -PathType Container)) {
            throw "System font directory is unavailable for offscreen UI tests."
          }
          "QT_QPA_FONTDIR=$fontDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Compile independent UI targets first so Qt/toolchain failures are
      # reported before the much longer native application build.
      - name: Build standalone UI targets
        shell: cmd
        run: |
          @echo on
          cd toonz\build
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal "/flp:logfile=ui-preflight.log;verbosity=minimal" toonz\ui_commandpalette_test.vcxproj
          if errorlevel 1 exit /b %ERRORLEVEL%
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal "/flp:logfile=ui-preflight.log;verbosity=minimal;append" toonz\ui_themeapplication_test.vcxproj
          if errorlevel 1 exit /b %ERRORLEVEL%

      # Check the standalone toolkit runtime early; the full UI suite below
      # also verifies the completed application package.
      - name: Test standalone UI targets
        id: ui_preflight
        shell: cmd
        run: |
          set "PATH=%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          cd toonz\build
          ctest -C RelWithDebInfo --output-on-failure --output-junit ui-preflight-tests.xml --no-tests=error -R "^ui_(commandpalette|themeapplication)$" > ui-preflight-tests-output.txt 2>&1
          set "UI_TEST_EXIT=%ERRORLEVEL%"
          type ui-preflight-tests-output.txt
          exit /b %UI_TEST_EXIT%

      - name: Report standalone UI failures
        if: ${{ failure() && steps.ui_preflight.outcome == 'failure' }}
        run: python ci-scripts/report_ui_tests.py toonz/build/ui-preflight-tests-output.txt "Standalone UI regression"

      - name: Diagnose standalone theme crash
        if: ${{ failure() && steps.ui_preflight.outcome == 'failure' }}
        timeout-minutes: 3
        shell: pwsh
        run: ./ci-scripts/debug_theme_test_windows.ps1 -BuildDirectory toonz/build -ThemeDirectory stuff/config/qss -TestOutput toonz/build/ui-preflight-tests-output.txt -QtDirectory $env:QT_PATH

      # Build Opentoonz using MSBuild
      - name: Build Opentoonz
        run: |
          @echo on
          cd toonz\build
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal "/flp:logfile=msbuild-errors.log;verbosity=minimal" ALL_BUILD.vcxproj
        shell: cmd

      - name: Verify benchmark harness contracts
        run: python -m unittest discover -s ci-scripts/tests -p test_paired_benchmark.py

      # Show the compile and link errors on the run (annotations), since the
      # full log is not always reachable
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          cat toonz/build/cmake-config.log toonz/build/ui-preflight.log toonz/build/msbuild-errors.log 2>/dev/null > combined-build-errors.log || true
          [ -s combined-build-errors.log ] || exit 0
          grep -E -A5 'CMake Error|Could NOT find|lrelease error|: (fatal )?error ' combined-build-errors.log | head -120 > errors.txt || true
          echo "::notice title=Windows build::$(wc -l < errors.txt) distinct errors"
          all=$(sed -e 's/%/%25/g' errors.txt | sed -e 's/\r//' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$all" ] && echo "::error title=Windows build errors::${all}"
          head -10 errors.txt | while IFS= read -r line; do echo "::error::${line}"; done

      # Create the package
      - name: Create Package
        id: package
        run: |
          @echo on
          cd toonz\build
          
          REM Create Opentoonz directory and copy files from RelWithDebInfo
          mkdir Opentoonz
          copy /Y RelWithDebInfo\*.* Opentoonz\
          xcopy /Y /E /I licenses Opentoonz\licenses
          REM Copy required DLLs for proper functionality
          copy /Y ..\..\thirdparty\glut\3.7.6\lib\glut64.dll Opentoonz
          copy /Y ..\..\thirdparty\glew\glew-1.9.0\bin\64bit\glew32.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libiconv-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libintl-8.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libjson-c-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libmypaint-1-4-0.dll Opentoonz
          
          REM Copy OpenCV DLL (IMPORTANT: Update path/filename when upgrading OpenCV version)
          copy /Y "C:\tools\opencv\build\x64\vc16\bin\opencv_world4130.dll" Opentoonz
          
          REM Deploy Qt dependencies
          "%QT_PATH%\bin\windeployqt.exe" Opentoonz\Opentoonz.exe --opengl

          del /Q Opentoonz\*.pdb  REM Remove .pdb files
          del /Q Opentoonz\vc_redist.x64.exe REM Remove vc_redist.x64.exe file
          
          REM Create portablestuff directory and copy stuff folder
          mkdir Opentoonz\portablestuff
          xcopy /Y /E /I ..\..\stuff .\Opentoonz\portablestuff
          REM The optional inspection SDK uses the separately installed Python.
          xcopy /Y /E /I seexpr-python Opentoonz\sdk\python
          copy /Y ..\..\stuff\doc\LICENSE\LICENSE_seexpr.txt Opentoonz\sdk\python\LICENSE_seexpr.txt
        shell: cmd

      - name: Install optional Cadmium worker
        id: install_worker
        uses: actions/download-artifact@v6
        with:
          name: cadmium-runtime-windows-x64
          path: toonz/build/Opentoonz

      - name: Qualify native neural host
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          set "QT_QPA_FONTDIR=%WINDIR%\Fonts"
          python ci-scripts/neural-style/host.py

      - name: Retain reference style qualification and visual examples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ReferenceStyle-${{ runner.os }}-${{ github.sha }}
          path: neural-evaluation/report
          if-no-files-found: warn

      - name: Test particle cache integration
        id: particle_tests
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          cd toonz\build
          ctest -C RelWithDebInfo --output-on-failure --output-junit particle-tests.xml --timeout 300 --no-tests=error -R "^(particlecache_|referencecolormatch$)" > particle-tests-output.txt 2>&1
          set "PARTICLE_TEST_EXIT=%ERRORLEVEL%"
          type particle-tests-output.txt
          exit /b %PARTICLE_TEST_EXIT%

      - name: Report particle test failures
        if: ${{ failure() && steps.particle_tests.outcome == 'failure' }}
        run: python ci-scripts/report_particle_tests.py toonz/build/particle-tests-output.txt

      - name: Test cel effects
        id: cel_tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          set "QT_DEBUG_PLUGINS=1"
          cd toonz\build
          ctest -C RelWithDebInfo --output-on-failure --output-junit cel-tests.xml --no-tests=error -R "^celfx_" > cel-tests-output.txt 2>&1
          set "CEL_TEST_EXIT=%ERRORLEVEL%"
          type cel-tests-output.txt
          exit /b %CEL_TEST_EXIT%

      - name: Test Cadmium adapters
        id: cadmium_tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          cd toonz\build
          python ../../ci-scripts/run_windows_gl_test.py --runtime "%NATIVE_UI_MESA_RUNTIME%" --renderer-executable "%CD%\RelWithDebInfo\cadmium_vector_test.exe" --timeout 600 -- ctest -C RelWithDebInfo --output-on-failure --no-tests=error -R "^cadmium_" > cadmium-tests-output.txt 2>&1
          set "CADMIUM_TEST_EXIT=%ERRORLEVEL%"
          type cadmium-tests-output.txt
          exit /b %CADMIUM_TEST_EXIT%

      - name: Test native UI features
        id: ui_tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          cd toonz\build
          python ../../ci-scripts/run_regression_tests.py --config RelWithDebInfo --report ui-tests.xml --include-prefix ui_ ui_shellthumbnail ui_vector_opacity ui_vector_profilemanager ui_vector_gradientanimation ui_vector_svgopacity ui_vector_pliprofile ui_vector_morphworkflow ui_vector_contour_outline ui_mediacache ui_functioncurveoperations ui_functionworkflow ui_commandpalette ui_widgetinspector ui_themeapplication ui_themeproperties ui_uitranslations ui_languagemanager ui_messagehistory ui_diagnosticswriter ui_diagnosticsservice > ui-tests-output.txt 2>&1
          set "UI_TEST_EXIT=%ERRORLEVEL%"
          type ui-tests-output.txt
          exit /b %UI_TEST_EXIT%

      - name: Test native application integration
        id: ui_integration
        env:
          GZ_CAST_WORKFLOW_REPORT: ${{ github.workspace }}/toonz/build/cast-workflow-metrics.json
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 40
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          python ci-scripts/run_native_ui_test.py toonz/build/Opentoonz/OpenToonz.exe stuff --require-function-workflow --require-offline-gl-workflow --require-vector-workflows --require-combined-workflows --output toonz/build/ui-integration-output.txt --windows-crash-debugger --debugger-symbols toonz/build/RelWithDebInfo --windows-mesa "%NATIVE_UI_MESA_RUNTIME%"

      - name: Report native application integration failure
        if: ${{ failure() && steps.ui_integration.outcome == 'failure' }}
        run: python ci-scripts/report_ui_tests.py toonz/build/ui-integration-output.txt

      - name: Measure native artist workloads
        id: artist_benchmark
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 8
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          python ci-scripts/run_native_ui_test.py toonz/build/Opentoonz/OpenToonz.exe stuff --artist-benchmark --output toonz/build/artist-workload-output.txt --windows-mesa "%NATIVE_UI_MESA_RUNTIME%"

      - name: Report artist workload failure
        if: ${{ failure() && steps.artist_benchmark.outcome == 'failure' }}
        run: python ci-scripts/report_ui_tests.py toonz/build/artist-workload-output.txt

      - name: Upload artist workflow evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artist-workflow-windows
          path: |
            toonz/build/artist-workload-output.*
            toonz/build/ui-integration-output*.txt
            toonz/build/ui-tests-output.txt
          if-no-files-found: ignore

      - name: Report native application crash stack
        if: ${{ failure() && steps.ui_integration.outcome == 'failure' }}
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath toonz/build/ui-integration-output-debugger.txt) {
            python ci-scripts/report_ui_tests.py toonz/build/ui-integration-output-debugger.txt "Native application crash stack"
          }

      - name: Report native UI failures
        if: ${{ failure() && steps.ui_tests.outcome == 'failure' }}
        run: python ci-scripts/report_ui_tests.py toonz/build/ui-tests-output.txt

      - name: Diagnose packaged theme crash
        if: ${{ failure() && steps.ui_tests.outcome == 'failure' }}
        timeout-minutes: 3
        shell: pwsh
        run: ./ci-scripts/debug_theme_test_windows.ps1 -BuildDirectory toonz/build -ThemeDirectory stuff/config/qss -TestOutput toonz/build/ui-tests-output.txt -QtDirectory $env:QT_PATH

      - name: Diagnose Function Editor widget crash
        if: ${{ failure() && steps.ui_tests.outcome == 'failure' }}
        timeout-minutes: 3
        shell: pwsh
        run: python ci-scripts/debug_ui_test_windows.py --build toonz/build --qt "$env:QT_PATH" --test ui_functionworkflow --test-output toonz/build/ui-tests-output.txt --output toonz/build/function-workflow-debugger.txt

      - name: Report Function Editor widget crash stack
        if: ${{ failure() && hashFiles('toonz/build/function-workflow-debugger.txt') != '' }}
        run: python ci-scripts/report_ui_tests.py toonz/build/function-workflow-debugger.txt "Function Editor crash stack"

      - name: Diagnose vector profile widget crash
        if: ${{ failure() && steps.ui_tests.outcome == 'failure' }}
        timeout-minutes: 3
        shell: pwsh
        run: python ci-scripts/debug_ui_test_windows.py --build toonz/build --qt "$env:QT_PATH" --test ui_vector_profilemanager --test-output toonz/build/ui-tests-output.txt --output toonz/build/vector-profile-debugger.txt

      - name: Report vector profile widget crash stack
        if: ${{ failure() && hashFiles('toonz/build/vector-profile-debugger.txt') != '' }}
        run: python ci-scripts/report_ui_tests.py toonz/build/vector-profile-debugger.txt "Vector profile crash stack"

      - name: Retain native widget diagnostics
        if: ${{ !cancelled() && steps.ui_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: native-widget-crash-windows
          path: |
            toonz/build/ui-tests.xml
            toonz/build/ui-tests-output.txt
            toonz/build/function-workflow-debugger.txt
            toonz/build/vector-profile-debugger.txt
          if-no-files-found: ignore

      - name: Report Cadmium adapter failures
        if: ${{ failure() && steps.cadmium_tests.outcome == 'failure' }}
        run: python ci-scripts/report_ui_tests.py toonz/build/cadmium-tests-output.txt "Cadmium adapter regression"

      - name: Test SeExpr native integration
        id: seexpr_tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          set "QT_QPA_FONTDIR=%WINDIR%\Fonts"
          cd toonz\build
          ctest -C RelWithDebInfo --output-on-failure --output-junit seexpr-tests.xml --no-tests=error --timeout 180 -R "^seexpr_" > seexpr-tests-output.txt 2>&1
          set "SEEXPR_TEST_EXIT=%ERRORLEVEL%"
          type seexpr-tests-output.txt
          exit /b %SEEXPR_TEST_EXIT%

      - name: Report SeExpr test failures
        if: ${{ failure() && steps.seexpr_tests.outcome == 'failure' }}
        run: python ci-scripts/seexpr/report.py toonz/build/seexpr-tests-output.txt

      - name: Report native SeExpr crash stack
        if: ${{ failure() && steps.seexpr_tests.outcome == 'failure' }}
        shell: pwsh
        run: |
          $report = "toonz/build/seexpr-native-output-debugger.txt"
          if (Test-Path -LiteralPath $report -PathType Leaf) {
            python ci-scripts/seexpr/report.py $report
          }

      - name: Test reliability and performance invariants
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          cd toonz\build
          python ..\..\ci-scripts\run_regression_tests.py --config RelWithDebInfo castworkflow rasterallocation timagecache levelselection save_transaction movierenderqueue levelupdater_abort trenderer_startup renderoutputbudget executor_submission compressed_stream scenebench fxrender ffmpeg_public tiio_psd tiio_exr_level

      - name: Upload reliability diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-reliability-results
          path: |
            toonz/build/reliability-tests.xml
            toonz/build/cast-workflow-metrics.json
            toonz/build/stdfx/fxrender-output
          if-no-files-found: ignore

      - name: Verify models and exercise native painting pipelines
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.install_worker.outcome == 'success' }}
        shell: cmd
        run: |
          set "PATH=%CD%\toonz\build\Opentoonz;%QT_PATH%\bin;%PATH%"
          set "QT_PLUGIN_PATH=%QT_PATH%\plugins"
          set "QT_QPA_PLATFORM_PLUGIN_PATH=%QT_PATH%\plugins\platforms"
          toonz\build\RelWithDebInfo\cadmium_installer_test.exe --download models
          if errorlevel 1 exit /b 1
          python ci-scripts/run_windows_gl_test.py --runtime "%NATIVE_UI_MESA_RUNTIME%" --renderer-executable "%CD%\toonz\build\RelWithDebInfo\cadmium_pipeline_test.exe" --timeout 600 -- toonz\build\RelWithDebInfo\cadmium_pipeline_test.exe "%CD%\toonz\build\Opentoonz\cadmium-sidecar.exe" "%CD%\models"

      - name: Report cel test failures
        if: ${{ failure() && steps.cel_tests.outcome == 'failure' }}
        run: python ci-scripts/report_cel_tests.py toonz/build/cel-tests-output.txt

      - name: Add the recorder encoder to the package
        shell: cmd
        run: |
          xcopy /Y /E /I recorder-encoder toonz\build\Opentoonz\otdev-recorder
          copy /Y .github\ot-dev\recorder\README.md toonz\build\Opentoonz\otdev-recorder\README.md

      - name: Remove native test drivers from the package
        shell: pwsh
        run: |
          $package = "toonz/build/Opentoonz"
          $drivers = @("seexpr_plugin_test", "seexpr_animation_test", "seexpr_fx_test", "seexpr_surface_fx_test", "seexpr_native_animcurve_test", "glbsurface_test", "seexpr_editor_test", "seexpr_controls_test", "seexpr_range_test", "seexpr_batch_fixture", "ui_shellthumbnail_test", "neuralstyle_host_test", "neuralstyle_test", "neuralstyle_editor_test")
          $suffixes = @(".exe", ".lib", ".exp", ".pdb", ".ilk", ".ipdb", ".iobj", ".exe.manifest")
          foreach ($driver in $drivers) {
            foreach ($suffix in $suffixes) {
              $path = Join-Path $package ($driver + $suffix)
              if (Test-Path -LiteralPath $path) {
                Remove-Item -LiteralPath $path -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $path) {
                throw "A native test driver or companion artifact remained in the production package"
              }
            }
          }

      - name: Verify test-only native artifacts are absent
        shell: pwsh
        run: |
          foreach ($directory in @("toonz/build/RelWithDebInfo", "toonz/build/Opentoonz")) {
            foreach ($name in @("opengl32.dll", "libgallium_wgl.dll", "OpenToonz.exe.local", "tconverter.exe.local", "ui_shellthumbnail_test.exe.local", "cadmium_vector_test.exe.local", "cadmium_pipeline_test.exe.local", "tcomposer.exe.local", "SeExprSdkFixture.dll", "SeExprInvalidFixture.dll")) {
              if (Test-Path -LiteralPath (Join-Path $directory $name)) {
                throw "A test-only renderer or SDK fixture remained in the application runtime or package"
              }
            }
          }

      - name: Prepare optional benchmark bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_bundle }}
        shell: pwsh
        run: >-
          python ci-scripts/benchmark_bundle.py --build toonz/build --platform windows
          --configuration RelWithDebInfo --qt-version 5.15.2
          --revision "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID"
          --run-attempt "$env:GITHUB_RUN_ATTEMPT" --output benchmark-input.tar.gz

      - name: Upload optional benchmark bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_bundle }}
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-input-windows
          path: benchmark-input.tar.gz
          compression-level: 0
          if-no-files-found: error

      # Create artifact from the build
      - name: Verify native UI renderer was removed from package
        shell: pwsh
        run: |
          foreach ($name in @("opengl32.dll", "libgallium_wgl.dll", "OpenToonz.exe.local", "tconverter.exe.local", "ui_shellthumbnail_test.exe.local", "cadmium_vector_test.exe.local", "cadmium_pipeline_test.exe.local")) {
            if (Test-Path -LiteralPath (Join-Path "toonz/build/Opentoonz" $name)) {
              throw "A temporary native UI renderer file remained in the package"
            }
          }

      - name: Create Artifact
        run: |
          mkdir artifact
          xcopy toonz\build\Opentoonz artifact\ /E /H /Y
        shell: cmd

      # Upload the generated artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Groundzero-${{ github.event.pull_request.number && format('PR-{0}', github.event.pull_request.number) || 'Branch-build' }}-Windows-${{ github.sha }}-${{ github.run_id }}
          path: artifact
          if-no-files-found: error
          include-hidden-files: true

  InstalledApplication:
    needs: Windows
    uses: ./.github/workflows/seexpr-package-smoke.yml
    with:
      platform: windows
      artifact_name: Groundzero-${{ github.event.pull_request.number && format('PR-{0}', github.event.pull_request.number) || 'Branch-build' }}-Windows-${{ github.sha }}-${{ github.run_id }}

