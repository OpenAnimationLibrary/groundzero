name: Build and Release

on:
  schedule:
    - cron: '17 8 * * *' # Daily at 08:17 UTC.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease after all three builds succeed
        type: boolean
        default: true

permissions:
  contents: read

# Queue a new release build without interrupting the current one.
concurrency:
  group: groundzero-build-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'OpenAnimationLibrary/groundzero'
    uses: ./.github/workflows/workflow_windows.yml

  macos:
    if: github.repository == 'OpenAnimationLibrary/groundzero'
    uses: ./.github/workflows/workflow_macos.yml

  linux:
    if: github.repository == 'OpenAnimationLibrary/groundzero'
    uses: ./.github/workflows/workflow_linux.yml

  release:
    needs: [windows, macos, linux]
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Windows package
        uses: actions/download-artifact@v6
        with:
          name: Groundzero-Branch-build-Windows-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/windows

      - name: Download macOS package
        uses: actions/download-artifact@v6
        with:
          name: Opentoonz-macOS-${{ github.sha }}
          path: artifacts/macos

      - name: Download Linux package
        uses: actions/download-artifact@v6
        with:
          name: Opentoonz-Linux-gcc-${{ github.sha }}
          path: artifacts/linux

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          # A unique tag preserves earlier builds; reruns reuse the same tag.
          tag="build-${GITHUB_RUN_ID}"
          base="OpenToonz-groundzero-${GITHUB_RUN_ID}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          mkdir out
          test -s artifacts/windows/OpenToonz.exe
          (cd artifacts/windows && zip -qr9 "$GITHUB_WORKSPACE/out/${base}-Windows-x64.zip" .)
          cp artifacts/macos/OpenToonz.dmg "out/${base}-macOS-x86_64.dmg"
          cp "artifacts/linux/Opentoonz-Linux-gcc-${BUILD_SHA}.tar.gz" "out/${base}-Linux-x86_64.tar.gz"
          test -s "out/${base}-Windows-x64.zip"
          test -s "out/${base}-macOS-x86_64.dmg"
          test -s "out/${base}-Linux-x86_64.tar.gz"
          (cd out && sha256sum ./*.zip ./*.dmg ./*.tar.gz > "${base}-SHA256SUMS.txt")
          {
            echo "Groundzero development build from commit ${BUILD_SHA}."
            echo
            echo "Windows x64, macOS Intel x86_64, and Linux x86_64."
            echo
            echo "Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-notes.md

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          # The log host is not reachable from every environment, so every
          # command here reports its failure as an annotation (see CLAUDE.md).
          report() {
            local status=$1; shift
            echo "::error title=Publish prerelease::$* failed (exit $status): $(tr '\n' ' ' < step-error.log | cut -c1-1000)"
            return "$status"
          }
          # One try: creating a release twice would leave two drafts.
          run() {
            "$@" 2> step-error.log || report $? "$@"
          }
          # Three tries for the calls that can be repeated (notes, edit, upload
          # with --clobber): asset uploads fail now and then on the network.
          retry() {
            local attempt status=0
            for attempt in 1 2 3; do
              "$@" 2> step-error.log && return 0
              status=$?
              if [ "$attempt" -lt 3 ]; then
                echo "::warning title=Publish prerelease::attempt $attempt of: $* failed: $(tr '\n' ' ' < step-error.log | cut -c1-500)"
                sleep $((attempt * 20))
              fi
            done
            report "$status" "$@"
          }
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            retry python3 .github/scripts/release_notes.py \
              --tag "$RELEASE_TAG" --target "$BUILD_SHA" \
              --intro-file release-notes.md --output release-notes.md
            run gh release create "$RELEASE_TAG" --draft --prerelease --latest=false \
              --target "$BUILD_SHA" --title "Groundzero ${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
          # Resume drafts with their original generated notes and baseline. Legacy
          # drafts receive a changelog once, preserving their existing introduction.
          retry python3 .github/scripts/release_notes.py \
            --tag "$RELEASE_TAG" --target "$BUILD_SHA" --existing-only \
            --output release-notes.md
          retry gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          # Keep the release unpublished until every asset has uploaded successfully.
          retry gh release upload "$RELEASE_TAG" out/* --clobber
          retry gh release edit "$RELEASE_TAG" --draft=false --latest=false
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"


