name: MacOS Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_bundle:
        description: Prepare an immutable scene benchmark bundle after validation
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  neural-oracle:
    name: macOS neural reference fixture
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate same-revision numerical oracle
        run: python ci-scripts/neural-style/evaluate.py
      - uses: actions/upload-artifact@v7
        with:
          name: macos-neural-oracle-${{ github.sha }}
          path: neural-evaluation/report/golden.npz
          if-no-files-found: error
  macOS:
    needs: neural-oracle
    timeout-minutes: 180 # Stop job if it exceeds expected build time
    # GHA are sunsetting support for macOS 13 (Intel & Apple Silicon/arm) & will be fully unsupported on (December 4th 2025),
    # See: https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/ & https://github.com/actions/runner-images/issues/13046
    # (Septemer 19th 2025) - Replacing `macos-13` runner image with the new `macos-15-intel` runner image to maintain macOS (Intel x64) support.
    # See: https://github.com/actions/runner-images/issues/13045
    # GHA (x86_64) SUNSETTING SUPPORT DEADLINE WARNING!!! `macos-15-intel` runner image will be the last available x86_64 image from Actions, and after (August 2027) the x86_64 architecture will not be supported on GitHub Actions.
    # Xref.: https://github.com/actions/runner-images/issues/13045
    # TODO: Change macOS GHA Runner Image to (Apple Silicon) based image on/prior to sunsetting of `macos-15-intel` (x86_64) runner image (August 2027)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Clean Python symlinks
        run: |
          # Remove potentially conflicting Python symlinks
          find /usr/local/bin -type l \( -name "python*" -o -name "pip*" -o -name "2to3*" -o -name "idle*" -o -name "pydoc*" \) \
            -exec sh -c 'file -b {} | grep -q "symbolic link to .*Python.framework" && echo "Removing {}" && rm {}' \;
          # Ensure Homebrew Python is properly linked
          for py_version in python@3.11 python@3.12 python@3.13 python@3.14; do
            if brew list --versions $py_version >/dev/null; then
              brew unlink $py_version || true
            fi
          done
          brew link --overwrite --force python@3.14 || true

      - name: Install libraries
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          checkPkgAndInstall() {
            for pkg in "$@"; do
              if brew ls --versions "$pkg" >/dev/null; then
                echo "$pkg already installed"
              else
                brew install "$pkg"
              fi
            done
          }

          checkPkgAndInstall bison flex pkg-config glew lz4 libjpeg libpng lzo boost libusb libmypaint ccache jpeg-turbo ninja opencv@4 ffmpeg

          brew list --formula | grep '^qt' | grep -v '@5' | xargs -n1 brew unlink || true

          brew install qt@5
          brew unlink qt@5 || true
          brew link qt@5 || true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify native diagnostic isolation
        run: python3 -m unittest discover -s ci-scripts/tests -p test_native_ui_diagnostics.py

      - name: Verify original native crash identity and process contracts
        run: |
          python3 -m unittest discover -s ci-scripts/tests -p test_native_macos_crash.py -v
          python3 -m unittest discover -s ci-scripts/tests -p test_windows_process.py -v

      - name: Select SeExpr parser tools
        run: |
          brew --prefix bison | sed 's|$|/bin|' >> "$GITHUB_PATH"
          brew --prefix flex | sed 's|$|/bin|' >> "$GITHUB_PATH"

      - name: Set up cache
        run: |
          export PATH="/usr/local/opt/ccache/libexec:$PATH"
          mkdir -p /Users/runner/.ccache
      - uses: actions/cache/restore@v5
        id: compiler_cache
        with:
          path: /Users/runner/.ccache
          key: ${{ runner.os }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-

      - name: Build libtiff
        run: |
          cd thirdparty/tiff-4.0.3
          CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-lzma
          make -j $(sysctl -n hw.ncpu)
          make install  # Ensures CMake finds the installed lib (avoid linking issues)
      - name: Build
        id: build
        run: |
          set -o pipefail
          export PKG_CONFIG_PATH="/usr/local/opt/jpeg-turbo/lib/pkgconfig:$PKG_CONFIG_PATH"
          cd toonz
          rm -rf build  
          mkdir -p build
          cd build
          cmake ../sources -G Ninja \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DQT_PATH=$(brew --prefix qt@5)/lib \
            -DQt5_DIR=$(brew --prefix qt@5)/lib/cmake/Qt5 \
            -DCMAKE_PREFIX_PATH=$(brew --prefix qt@5)/lib/cmake/Qt5 \
            -DOpenCV_DIR=$(brew --prefix opencv@4)/lib/cmake/opencv4 \
            -DWITH_TRANSLATION=ON -DBUILD_UI_PORT_TESTS=ON \
            -DBUILD_LUT3D_TESTS=ON -DBUILD_PARTICLE_CACHE_TESTS=ON \
            -DBUILD_RELIABILITY_TESTS=ON \
            -DBUILD_STREAM_TESTS=ON \
            -DBUILD_SCENEBENCH_TESTS=ON \
            -DBUILD_FXRENDER_TESTS=ON \
            -DBUILD_FFMPEG_TESTS=ON \
            -DBUILD_PSD_TESTS=ON \
            -DBUILD_EXR_TESTS=ON \
            -DBUILD_SEEXPR_TESTS=ON \
            -DBUILD_SEEXPR_PYTHON=ON \
            -DPython3_EXECUTABLE="$(command -v python)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          ninja -j $(sysctl -n hw.ncpu) 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
      - name: Preserve compiled objects
        if: ${{ always() && steps.compiler_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: /Users/runner/.ccache
          key: ${{ runner.os }}-${{ github.sha }}

      - uses: actions/download-artifact@v6
        with:
          name: macos-neural-oracle-${{ github.sha }}
          path: neural-golden

      - name: Qualify native neural host
        run: python ci-scripts/neural-style/host.py

      - name: Retain reference style qualification and visual examples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ReferenceStyle-${{ runner.os }}-${{ github.sha }}
          path: neural-evaluation/report
          if-no-files-found: warn

      - name: Test native UI features
        id: ui_tests
        working-directory: toonz/build
        run: |
          set -o pipefail
          export DYLD_LIBRARY_PATH="$(find "$PWD" -name '*.dylib' -exec dirname {} \; | sort -u | paste -sd: -)${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          QT_QPA_PLATFORM=offscreen python3 ../../ci-scripts/run_regression_tests.py --report ui-tests.xml --include-prefix ui_ ui_vector_opacity ui_vector_profilemanager ui_vector_gradientanimation ui_vector_svgopacity ui_vector_pliprofile ui_vector_morphworkflow ui_vector_contour_outline ui_mediacache ui_functioncurveoperations ui_functionworkflow ui_commandpalette ui_widgetinspector ui_themeapplication ui_themeproperties ui_uitranslations ui_languagemanager ui_messagehistory ui_diagnosticswriter ui_diagnosticsservice 2>&1 | tee ui-tests-output.txt
      - name: Report native UI failures
        if: ${{ failure() && steps.ui_tests.outcome == 'failure' }}
        run: python3 ci-scripts/report_ui_tests.py toonz/build/ui-tests-output.txt

      - name: Test particle cache integration
        id: particle_tests
        working-directory: toonz/build
        run: |
          set -o pipefail
          DYLD_LIBRARY_PATH="$PWD/toonz/OpenToonz.app/Contents/MacOS" QT_QPA_PLATFORM=cocoa ctest --output-on-failure --output-junit particle-tests.xml --timeout 300 --no-tests=error -R '^(particlecache_|referencecolormatch$)' 2>&1 | tee particle-tests-output.txt

      - name: Report particle test failures
        if: ${{ failure() && steps.particle_tests.outcome == 'failure' }}
        run: python3 ci-scripts/report_particle_tests.py toonz/build/particle-tests-output.txt

      - name: Verify benchmark harness contracts
        run: python3 -m unittest discover -s ci-scripts/tests -p test_paired_benchmark.py

      - name: Verify native lifecycle harness contracts
        run: python3 -m unittest discover -s ci-scripts/tests -p test_native_ui_lifecycle.py

      - name: Verify bounded desktop GL launcher
        run: python3 -m unittest discover -s ci-scripts/tests -p test_windows_gl_test.py -v

      - name: Verify Unicode regression reporting
        run: python3 -m unittest discover -s ci-scripts/tests -p test_regression_reporting.py -v

      - name: Test SeExpr native integration
        id: seexpr_tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          # Native test executables and the original tcomposer live outside
          # the app bundle. The build copies their @executable_path libraries
          # beside OpenToonz before this step, ahead of macdeployqt packaging.
          app_libraries="$GITHUB_WORKSPACE/toonz/build/toonz/OpenToonz.app/Contents/MacOS"
          if [ ! -f "$app_libraries/libtnzbase.dylib" ]; then
            printf '%s\n' 'SeExpr macOS test runtime is missing libtnzbase.dylib in the built app bundle' | tee toonz/build/seexpr-tests-output.txt
            exit 1
          fi
          DYLD_LIBRARY_PATH="$app_libraries${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" \
            QT_QPA_PLATFORM=offscreen ctest --test-dir toonz/build --output-on-failure --output-junit seexpr-tests.xml --no-tests=error --timeout 180 -R '^seexpr_' 2>&1 | tee toonz/build/seexpr-tests-output.txt

      - name: Test native application integration
        id: ui_integration
        # Original 10-minute run plus six bounded isolated/LLDB pairs and setup.
        timeout-minutes: 45
        env:
          GZ_CAST_WORKFLOW_REPORT: ${{ github.workspace }}/toonz/build/cast-workflow-metrics.json
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          app_libraries="$GITHUB_WORKSPACE/toonz/build/toonz/OpenToonz.app/Contents/MacOS"
          DYLD_LIBRARY_PATH="$app_libraries${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" \
            QT_QPA_PLATFORM=cocoa python3 ci-scripts/run_native_ui_test.py "$app_libraries/OpenToonz" stuff --require-function-workflow --require-offline-gl-workflow --require-vector-workflows --require-combined-workflows --macos-crash-debugger --output toonz/build/ui-integration-output.txt

      - name: Report native application integration failure
        if: ${{ failure() && steps.ui_integration.outcome == 'failure' }}
        run: python3 ci-scripts/report_ui_tests.py toonz/build/ui-integration-output.txt

      - name: Test isolated timing process lifecycle
        id: timing_lifecycle
        # Timing (120s), required reviewed-clear (120s), and optional LLDB
        # (120s), plus existing bounded cleanup and fresh fixture copies.
        timeout-minutes: 9
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          app_libraries="$GITHUB_WORKSPACE/toonz/build/toonz/OpenToonz.app/Contents/MacOS"
          DYLD_LIBRARY_PATH="$app_libraries${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" \
            QT_QPA_PLATFORM=cocoa python3 ci-scripts/run_native_ui_test.py "$app_libraries/OpenToonz" stuff --isolated-timing-lifecycle --macos-crash-debugger --output toonz/build/ui-integration-output-timing-lifecycle.txt

      - name: Report isolated timing lifecycle failure
        if: ${{ failure() && steps.timing_lifecycle.outcome == 'failure' }}
        run: python3 ci-scripts/report_ui_tests.py toonz/build/ui-integration-output-timing-lifecycle.txt

      - name: Measure native artist workloads
        id: artist_benchmark
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          app_libraries="$GITHUB_WORKSPACE/toonz/build/toonz/OpenToonz.app/Contents/MacOS"
          DYLD_LIBRARY_PATH="$app_libraries${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" \
            QT_QPA_PLATFORM=cocoa python3 ci-scripts/run_native_ui_test.py "$app_libraries/OpenToonz" stuff --artist-benchmark --output toonz/build/artist-workload-output.txt

      - name: Report artist workload failure
        if: ${{ failure() && steps.artist_benchmark.outcome == 'failure' }}
        run: python3 ci-scripts/report_ui_tests.py toonz/build/artist-workload-output.txt

      - name: Upload artist workflow evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artist-workflow-macos
          path: |
            toonz/build/artist-workload-output.*
            toonz/build/ui-integration-output*.txt
            toonz/build/ui-tests-output.txt
          if-no-files-found: ignore

      - name: Report SeExpr test failures
        if: ${{ failure() && steps.seexpr_tests.outcome == 'failure' }}
        run: python ci-scripts/seexpr/report.py toonz/build/seexpr-tests-output.txt

      - name: Test reliability and performance invariants
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: toonz/build
        run: |
          # Internal dylibs use @executable_path install names. The app build
          # copies them beside its executable, while CTest executables live in
          # several build subdirectories. Resolve all tests against that same
          # current-build library set without changing the packaged app.
          runtime_lib_dir="$PWD/toonz/OpenToonz.app/Contents/MacOS"
          for library in libtnzcore.dylib libtnzbase.dylib libtoonzlib.dylib; do
            if [ ! -f "$runtime_lib_dir/$library" ]; then
              echo "::error::The built app is missing runtime library $library"
              exit 1
            fi
          done
          export DYLD_LIBRARY_PATH="$runtime_lib_dir"
          python3 ../../ci-scripts/run_regression_tests.py castworkflow rasterallocation timagecache levelselection save_transaction movierenderqueue levelupdater_abort trenderer_startup renderoutputbudget executor_submission compressed_stream scenebench fxrender ffmpeg_public tiio_ffmpeg tiio_psd tiio_exr_level

      - name: Upload reliability diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-reliability-results
          path: |
            toonz/build/reliability-tests.xml
            toonz/build/cast-workflow-metrics.json
            toonz/build/ui-integration-output*.txt
            toonz/build/stdfx/fxrender-output
            toonz/build/image/ffmpeg-test-output
          if-no-files-found: ignore
      # Show the errors on the run (summary and annotations) without opening
      # the full log, as the Linux and Windows builds do
      - name: Report build errors
        if: failure()
        run: |
          log="$GITHUB_WORKSPACE/build.log"
          [ -f "$log" ] || exit 0
          grep -E ': (fatal )?error:|CMake Error|undefined symbol|ld: |^FAILED:' "$log" | sort -u | head -60 > errors.txt || true
          {
            echo "## macOS build errors"
            echo '```'
            cat errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          prefix="$GITHUB_WORKSPACE/"
          grep -E ': (fatal )?error:' errors.txt | head -40 | while IFS= read -r line; do
            file=${line%%:*}; rest=${line#*:}; lineno=${rest%%:*}
            msg=${line#*error: }
            file=${file#$prefix}; file=${file#../sources/}
            case "$file" in /*|toonz/*) ;; *) file="toonz/sources/$file" ;; esac
            echo "::error file=${file},line=${lineno}::${msg}"
          done
          grep -vE ': (fatal )?error:' errors.txt | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Introduce Libraries and Stuff
        run: |
          cd toonz/build/toonz
          cp -pr ../../../stuff OpenToonz.app/portablestuff
          mkdir -p OpenToonz.app/Contents/Resources/sdk
          cp -R ../seexpr-python OpenToonz.app/Contents/Resources/sdk/python
          cp ../../../stuff/doc/LICENSE/LICENSE_seexpr.txt OpenToonz.app/Contents/Resources/sdk/python/LICENSE_seexpr.txt
          mkdir -p OpenToonz.app/Contents/Resources/licenses
          cp ../licenses/Partio-LICENSE.txt OpenToonz.app/Contents/Resources/licenses/
          /usr/local/opt/qt@5/bin/macdeployqt OpenToonz.app -verbose=0 -always-overwrite \
            -executable=OpenToonz.app/Contents/MacOS/lzocompress \
            -executable=OpenToonz.app/Contents/MacOS/lzodecompress \
            -executable=OpenToonz.app/Contents/MacOS/tcleanup \
            -executable=OpenToonz.app/Contents/MacOS/tcomposer \
            -executable=OpenToonz.app/Contents/MacOS/tconverter \
            -executable=OpenToonz.app/Contents/MacOS/tfarmcontroller \
            -executable=OpenToonz.app/Contents/MacOS/tfarmserver
      - name: Modify Library Paths
        run: |
          cd toonz/build/toonz/OpenToonz.app/Contents/Frameworks
          for TARGETLIB in *.dylib; do
            otool -L "$TARGETLIB" | grep ".dylib" | grep -v "$TARGETLIB" | grep -v "@executable_path/../Frameworks" | awk '{print $1}' | while read -r FROMPATH; do
              LIBNAME=$(basename "$FROMPATH")
              if [[ -e ./$LIBNAME ]]; then
                install_name_tool -change "$FROMPATH" "@executable_path/../Frameworks/$LIBNAME" "$TARGETLIB"
              fi
            done
          done
      - name: Prepare optional benchmark bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_bundle }}
        run: |
          python3 ci-scripts/benchmark_bundle.py --build toonz/build --platform macos \
            --qt-version "$(/usr/local/opt/qt@5/bin/qmake -query QT_VERSION)" \
            --macdeployqt /usr/local/opt/qt@5/bin/macdeployqt \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output benchmark-input.tar.gz

      - name: Upload optional benchmark bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_bundle }}
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-input-macos
          path: benchmark-input.tar.gz
          compression-level: 0
          if-no-files-found: error

      - name: Create Artifact
        run: |
          cd toonz/build/toonz
          echo "Creating DMG..."
          ATTEMPT=1
          until /usr/local/opt/qt@5/bin/macdeployqt OpenToonz.app -dmg -verbose=0 && [ -f OpenToonz.dmg ]; do
            echo "Attempt $ATTEMPT failed to build DMG."
            if [ $ATTEMPT -eq 10 ]; then
              echo ">>> DMG file creation failed after 10 attempts. Aborting!"
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Retrying in 5 seconds..."
            sleep 5
          done
          echo "DMG created successfully."
      # A transient artifact-service DNS failure must not throw away a built
      # DMG. Retry only delivery, with bounded backoff; the last attempt is
      # required, so a package that never uploads still fails the job.
      - name: Upload macOS package
        id: upload_macos
        uses: actions/upload-artifact@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          name: Opentoonz-${{ runner.os }}-${{ github.sha }}
          path: toonz/build/toonz/OpenToonz.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Wait before retrying macOS upload
        if: ${{ !cancelled() && steps.upload_macos.outcome == 'failure' }}
        run: sleep 10
      - name: Retry macOS package upload
        id: upload_macos_retry
        if: ${{ !cancelled() && steps.upload_macos.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          name: Opentoonz-${{ runner.os }}-${{ github.sha }}
          path: toonz/build/toonz/OpenToonz.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Wait before final macOS upload attempt
        if: ${{ !cancelled() && steps.upload_macos_retry.outcome == 'failure' }}
        run: sleep 30
      - name: Final macOS package upload attempt
        if: ${{ !cancelled() && steps.upload_macos_retry.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        timeout-minutes: 5
        with:
          name: Opentoonz-${{ runner.os }}-${{ github.sha }}
          path: toonz/build/toonz/OpenToonz.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  InstalledApplication:
    needs: macOS
    uses: ./.github/workflows/seexpr-package-smoke.yml
    with:
      platform: macos
      artifact_name: Opentoonz-macOS-${{ github.sha }}

