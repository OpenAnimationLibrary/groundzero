name: MacOS Build

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_bundle:
        description: Prepare an immutable scene benchmark bundle after validation
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  macOS:
    timeout-minutes: 180 # Stop job if it exceeds expected build time
    # GHA are sunsetting support for macOS 13 (Intel & Apple Silicon/arm) & will be fully unsupported on (December 4th 2025),
    # See: https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/ & https://github.com/actions/runner-images/issues/13046
    # (Septemer 19th 2025) - Replacing `macos-13` runner image with the new `macos-15-intel` runner image to maintain macOS (Intel x64) support.
    # See: https://github.com/actions/runner-images/issues/13045
    # GHA (x86_64) SUNSETTING SUPPORT DEADLINE WARNING!!! `macos-15-intel` runner image will be the last available x86_64 image from Actions, and after (August 2027) the x86_64 architecture will not be supported on GitHub Actions.
    # Xref.: https://github.com/actions/runner-images/issues/13045
    # TODO: Change macOS GHA Runner Image to (Apple Silicon) based image on/prior to sunsetting of `macos-15-intel` (x86_64) runner image (August 2027)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Clean Python symlinks
        run: |
          # Remove potentially conflicting Python symlinks
          find /usr/local/bin -type l \( -name "python*" -o -name "pip*" -o -name "2to3*" -o -name "idle*" -o -name "pydoc*" \) \
            -exec sh -c 'file -b {} | grep -q "symbolic link to .*Python.framework" && echo "Removing {}" && rm {}' \;
          # Ensure Homebrew Python is properly linked
          for py_version in python@3.11 python@3.12 python@3.13 python@3.14; do
            if brew list --versions $py_version >/dev/null; then
              brew unlink $py_version || true
            fi
          done
          brew link --overwrite --force python@3.14 || true

      - name: Install libraries
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          checkPkgAndInstall() {
            for pkg in "$@"; do
              if brew ls --versions "$pkg" >/dev/null; then
                echo "$pkg already installed"
              else
                brew install "$pkg"
              fi
            done
          }

          checkPkgAndInstall pkg-config glew lz4 libjpeg libpng lzo boost libusb libmypaint ccache jpeg-turbo ninja opencv@4 ffmpeg

          brew list --formula | grep '^qt' | grep -v '@5' | xargs -n1 brew unlink || true

          brew install qt@5
          brew unlink qt@5 || true
          brew link qt@5 || true

      - name: Set up cache
        run: |
          export PATH="/usr/local/opt/ccache/libexec:$PATH"
          mkdir -p /Users/runner/.ccache
      - uses: actions/cache/restore@v5
        id: compiler_cache
        with:
          path: /Users/runner/.ccache
          key: ${{ runner.os }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-

      - name: Build libtiff
        run: |
          cd thirdparty/tiff-4.0.3
          CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-lzma
          make -j $(sysctl -n hw.ncpu)
          make install  # Ensures CMake finds the installed lib (avoid linking issues)
      - name: Build
        run: |
          set -o pipefail
          export PKG_CONFIG_PATH="/usr/local/opt/jpeg-turbo/lib/pkgconfig:$PKG_CONFIG_PATH"
          cd toonz
          rm -rf build  
          mkdir -p build
          cd build
          cmake ../sources -G Ninja \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DQT_PATH=$(brew --prefix qt@5)/lib \
            -DQt5_DIR=$(brew --prefix qt@5)/lib/cmake/Qt5 \
            -DCMAKE_PREFIX_PATH=$(brew --prefix qt@5)/lib/cmake/Qt5 \
            -DOpenCV_DIR=$(brew --prefix opencv@4)/lib/cmake/opencv4 \
            -DWITH_TRANSLATION=OFF -DBUILD_LUT3D_TESTS=ON -DBUILD_PARTICLE_CACHE_TESTS=ON -DBUILD_RELIABILITY_TESTS=ON \
            -DBUILD_STREAM_TESTS=ON -DBUILD_SCENEBENCH_TESTS=ON \
            -DBUILD_FXRENDER_TESTS=ON -DBUILD_FFMPEG_TESTS=ON -DBUILD_PSD_TESTS=ON
          ninja -j $(sysctl -n hw.ncpu) 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Test particle cache integration
        id: particle_tests
        working-directory: toonz/build
        run: |
          set -o pipefail
          DYLD_LIBRARY_PATH="$PWD/toonz/OpenToonz.app/Contents/MacOS" QT_QPA_PLATFORM=cocoa ctest --output-on-failure --output-junit particle-tests.xml --timeout 300 --no-tests=error -R '^(particlecache_|referencecolormatch$)' 2>&1 | tee particle-tests-output.txt

      - name: Report particle test failures
        if: ${{ failure() && steps.particle_tests.outcome == 'failure' }}
        run: python3 ci-scripts/report_particle_tests.py toonz/build/particle-tests-output.txt


      # Leave application Python discovery unchanged; pin only the later
      # harness and packaging interpreter.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify benchmark harness contracts
        run: python3 -m unittest discover -s ci-scripts/tests -p test_paired_benchmark.py

      - name: Test reliability and performance invariants
        working-directory: toonz/build
        run: |
          # Internal dylibs use @executable_path install names. The app build
          # copies them beside its executable, while CTest executables live in
          # several build subdirectories. Resolve all tests against that same
          # current-build library set without changing the packaged app.
          runtime_lib_dir="$PWD/toonz/OpenToonz.app/Contents/MacOS"
          for library in libtnzcore.dylib libtnzbase.dylib libtoonzlib.dylib; do
            if [ ! -f "$runtime_lib_dir/$library" ]; then
              echo "::error::The built app is missing runtime library $library"
              exit 1
            fi
          done
          export DYLD_LIBRARY_PATH="$runtime_lib_dir"
          python3 ../../ci-scripts/run_regression_tests.py rasterallocation timagecache levelselection save_transaction movierenderqueue levelupdater_abort trenderer_startup renderoutputbudget executor_submission compressed_stream scenebench fxrender ffmpeg_public tiio_ffmpeg tiio_psd

      - name: Upload reliability diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-reliability-results
          path: |
            toonz/build/reliability-tests.xml
            toonz/build/stdfx/fxrender-output
            toonz/build/image/ffmpeg-test-output
          if-no-files-found: ignore
      # Show the errors on the run (summary and annotations) without opening
      # the full log, as the Linux and Windows builds do
      - name: Report build errors
        if: failure()
        run: |
          log="$GITHUB_WORKSPACE/build.log"
          [ -f "$log" ] || exit 0
          grep -E ': (fatal )?error:|CMake Error|undefined symbol|ld: |^FAILED:' "$log" | sort -u | head -60 > errors.txt || true
          {
            echo "## macOS build errors"
            echo '```'
            cat errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          prefix="$GITHUB_WORKSPACE/"
          grep -E ': (fatal )?error:' errors.txt | head -40 | while IFS= read -r line; do
            file=${line%%:*}; rest=${line#*:}; lineno=${rest%%:*}
            msg=${line#*error: }
            file=${file#$prefix}; file=${file#../sources/}
            case "$file" in /*|toonz/*) ;; *) file="toonz/sources/$file" ;; esac
            echo "::error file=${file},line=${lineno}::${msg}"
          done
          grep -vE ': (fatal )?error:' errors.txt | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      # Keep valid compiled objects even when an integration test fails.
      - name: Save compiler cache
        if: ${{ always() && steps.compiler_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: /Users/runner/.ccache
          key: ${{ runner.os }}-${{ github.sha }}

      - name: Introduce Libraries and Stuff
        run: |
          cd toonz/build/toonz
          cp -pr ../../../stuff OpenToonz.app/portablestuff
          mkdir -p OpenToonz.app/Contents/Resources/licenses
          cp ../licenses/Partio-LICENSE.txt OpenToonz.app/Contents/Resources/licenses/
          /usr/local/opt/qt@5/bin/macdeployqt OpenToonz.app -verbose=0 -always-overwrite \
            -executable=OpenToonz.app/Contents/MacOS/lzocompress \
            -executable=OpenToonz.app/Contents/MacOS/lzodecompress \
            -executable=OpenToonz.app/Contents/MacOS/tcleanup \
            -executable=OpenToonz.app/Contents/MacOS/tcomposer \
            -executable=OpenToonz.app/Contents/MacOS/tconverter \
            -executable=OpenToonz.app/Contents/MacOS/tfarmcontroller \
            -executable=OpenToonz.app/Contents/MacOS/tfarmserver
      - name: Modify Library Paths
        run: |
          cd toonz/build/toonz/OpenToonz.app/Contents/Frameworks
          for TARGETLIB in *.dylib; do
            otool -L "$TARGETLIB" | grep ".dylib" | grep -v "$TARGETLIB" | grep -v "@executable_path/../Frameworks" | awk '{print $1}' | while read -r FROMPATH; do
              LIBNAME=$(basename "$FROMPATH")
              if [[ -e ./$LIBNAME ]]; then
                install_name_tool -change "$FROMPATH" "@executable_path/../Frameworks/$LIBNAME" "$TARGETLIB"
              fi
            done
          done
      - name: Prepare optional benchmark bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_bundle }}
        run: |
          python3 ci-scripts/benchmark_bundle.py --build toonz/build --platform macos \
            --qt-version "$(/usr/local/opt/qt@5/bin/qmake -query QT_VERSION)" \
            --macdeployqt /usr/local/opt/qt@5/bin/macdeployqt \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output benchmark-input.tar.gz

      - name: Upload optional benchmark bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_bundle }}
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-input-macos
          path: benchmark-input.tar.gz
          compression-level: 0
          if-no-files-found: error

      - name: Create Artifact
        run: |
          cd toonz/build/toonz
          echo "Creating DMG..."
          ATTEMPT=1
          until /usr/local/opt/qt@5/bin/macdeployqt OpenToonz.app -dmg -verbose=0 && [ -f OpenToonz.dmg ]; do
            echo "Attempt $ATTEMPT failed to build DMG."
            if [ $ATTEMPT -eq 10 ]; then
              echo ">>> DMG file creation failed after 10 attempts. Aborting!"
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Retrying in 5 seconds..."
            sleep 5
          done
          echo "DMG created successfully."
      # A transient artifact-service DNS failure must not throw away a built
      # DMG. Retry only delivery, with bounded backoff; the last attempt is
      # required, so a package that never uploads still fails the job.
      - name: Upload macOS package
        id: upload_macos
        uses: actions/upload-artifact@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          name: Opentoonz-${{ runner.os }}-${{ github.sha }}
          path: toonz/build/toonz/OpenToonz.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Wait before retrying macOS upload
        if: ${{ !cancelled() && steps.upload_macos.outcome == 'failure' }}
        run: sleep 10
      - name: Retry macOS package upload
        id: upload_macos_retry
        if: ${{ !cancelled() && steps.upload_macos.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          name: Opentoonz-${{ runner.os }}-${{ github.sha }}
          path: toonz/build/toonz/OpenToonz.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Wait before final macOS upload attempt
        if: ${{ !cancelled() && steps.upload_macos_retry.outcome == 'failure' }}
        run: sleep 30
      - name: Final macOS package upload attempt
        if: ${{ !cancelled() && steps.upload_macos_retry.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        timeout-minutes: 5
        with:
          name: Opentoonz-${{ runner.os }}-${{ github.sha }}
          path: toonz/build/toonz/OpenToonz.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true

