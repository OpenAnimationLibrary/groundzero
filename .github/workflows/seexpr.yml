name: SeExpr qualification

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - edition
      - 'ci/seexpr-*'

permissions:
  contents: read

concurrency:
  group: seexpr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # A dedicated development branch can qualify memory fixes without
    # restarting an in-flight platform SDK bootstrap. Pull requests, release
    # pushes and manual qualification still run the complete backend matrix.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/seexpr-sanitizer-')
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.backend == 'llvm14' && matrix.runner == 'windows-2025' && 90 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux interpreter
            runner: ubuntu-22.04
            backend: interpreter
          - label: Linux interpreter PyQt6
            runner: ubuntu-22.04
            backend: interpreter
            qt_api: pyqt6
          - label: Windows interpreter
            runner: windows-2025
            backend: interpreter
          - label: macOS interpreter
            runner: macos-15-intel
            backend: interpreter
          - label: Linux LLVM 14
            runner: ubuntu-22.04
            backend: llvm14
          - label: Windows LLVM 14
            runner: windows-2025
            backend: llvm14
          - label: macOS LLVM 14
            runner: macos-15-intel
            backend: llvm14
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python UI qualification dependency
        shell: bash
        run: |
          if [ '${{ matrix.qt_api }}' = 'pyqt6' ]; then
            python -m pip install --disable-pip-version-check --retries 3 PyQt6==6.7.1
          else
            python -m pip install --disable-pip-version-check --retries 3 PyQt5==5.15.11
          fi
      - name: Install Linux parser tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=3
          sudo apt-get install -y bison flex python3-dev libegl1
      - name: Install LLVM 14 qualification dependencies
        if: matrix.backend == 'llvm14' && runner.os == 'Linux'
        run: |
          set -o pipefail
          sudo apt-get install -y llvm-14-dev libffi-dev libtinfo-dev zlib1g-dev
          printf '%s\n' 'LLVM_DIR=/usr/lib/llvm-14/lib/cmake/llvm' >> "$GITHUB_ENV"
          python ci-scripts/seexpr/install_llvm.py --license-only 2>&1 | tee seexpr-llvm-dependency.log
      - name: Cache pinned LLVM 14 development SDK
        id: llvm_cache
        if: matrix.backend == 'llvm14' && runner.os != 'Linux'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/seexpr-llvm14-sdk
          key: seexpr-llvm14-sdk-v1-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('ci-scripts/seexpr/install_llvm.py') }}
      - name: Install pinned LLVM 14 development SDK
        if: matrix.backend == 'llvm14' && runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          python ci-scripts/seexpr/install_llvm.py 2>&1 | tee seexpr-llvm-dependency.log
      - name: Save installed LLVM 14 development SDK
        if: matrix.backend == 'llvm14' && runner.os != 'Linux' && steps.llvm_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/seexpr-llvm14-sdk
          key: ${{ steps.llvm_cache.outputs.cache-primary-key }}
      - name: Install macOS parser tools
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew list --versions bison >/dev/null || brew install bison
          brew list --versions flex >/dev/null || brew install flex
          brew --prefix bison | sed 's|$|/bin|' >> "$GITHUB_PATH"
          brew --prefix flex | sed 's|$|/bin|' >> "$GITHUB_PATH"
      - name: Install Windows parser tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci-scripts/seexpr/install_parser_windows.ps1
      - name: Configure Windows offscreen fonts
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "QT_QPA_FONTDIR=$env:WINDIR\Fonts" -Encoding utf8
      - name: Configure interpreter qualification
        if: matrix.backend == 'interpreter'
        shell: bash
        run: |
          set -o pipefail
          cmake -S ci-scripts/seexpr -B seexpr-build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_SEEXPR_PYTHON=ON -DBUILD_SEEXPR_PYTHON_UI_TESTS=ON -DSEEXPR_PYTHON_QT_API=${{ matrix.qt_api || 'pyqt5' }} 2>&1 | tee seexpr-configure.log
      - name: Configure LLVM qualification
        if: matrix.backend == 'llvm14'
        shell: bash
        run: |
          set -o pipefail
          cmake -S ci-scripts/seexpr -B seexpr-build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_SEEXPR_PYTHON=ON -DBUILD_SEEXPR_PYTHON_UI_TESTS=ON -DOT_SEEXPR_WITH_LLVM=ON -DLLVM_DIR="$LLVM_DIR" 2>&1 | tee seexpr-configure.log
      - name: Build core and bindings
        shell: bash
        run: |
          set -o pipefail
          cmake --build seexpr-build --config RelWithDebInfo --parallel 4 2>&1 | tee seexpr-build.log
      - name: Test native runtime and SDK
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir seexpr-build -C RelWithDebInfo --output-on-failure --output-junit seexpr-tests.xml --no-tests=error --timeout 120 2>&1 | tee seexpr-tests.log
      - name: Report qualification failure
        if: failure()
        run: python ci-scripts/seexpr/report.py seexpr-llvm-dependency.log seexpr-configure.log seexpr-build.log seexpr-tests.log
      - name: Install and qualify the standalone SDK
        id: installed_sdk
        shell: bash
        run: |
          set -o pipefail
          sdk_dependency=()
          if [ "${{ matrix.backend }}" = llvm14 ]; then
            sdk_dependency=("-DLLVM_DIR=$LLVM_DIR")
          fi
          cmake --install seexpr-build --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/seexpr-sdk" 2>&1 | tee seexpr-sdk-install.log
          cmake -S ci-scripts/seexpr/sdk_consumer -B seexpr-sdk-consumer -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/seexpr-sdk/sdk" "${sdk_dependency[@]}" 2>&1 | tee seexpr-sdk-configure.log
          cmake --build seexpr-sdk-consumer --config RelWithDebInfo --parallel 2 2>&1 | tee seexpr-sdk-build.log
          ctest --test-dir seexpr-sdk-consumer -C RelWithDebInfo --output-on-failure --no-tests=error 2>&1 | tee seexpr-sdk-tests.log
      - name: Package optional backend notices
        if: matrix.backend == 'llvm14'
        shell: bash
        run: |
          if [ ! -s "$LLVM_LICENSE_FILE" ]; then
            echo '::error title=SeExpr qualification::The optional backend distribution notice is missing.'
            exit 1
          fi
          for destination in seexpr-sdk/sdk/share/licenses/LICENSE_LLVM.txt seexpr-build/seexpr-python/LICENSE_LLVM.txt; do
            if ! cp "$LLVM_LICENSE_FILE" "$destination"; then
              echo '::error title=SeExpr qualification::Could not package the optional backend distribution notice.'
              exit 1
            fi
          done
      - name: Report installed SDK failure
        if: ${{ failure() && steps.installed_sdk.outcome == 'failure' }}
        run: python ci-scripts/seexpr/report.py seexpr-sdk-install.log seexpr-sdk-configure.log seexpr-sdk-build.log seexpr-sdk-tests.log
      - name: Upload qualified native SDK
        uses: actions/upload-artifact@v6
        with:
          name: SeExpr-SDK-${{ runner.os }}-${{ matrix.backend }}-${{ matrix.qt_api || 'pyqt5' }}-${{ github.sha }}
          path: seexpr-sdk/sdk
          if-no-files-found: error
      - name: Package Python SDK notices
        shell: bash
        run: |
          cp stuff/doc/LICENSE/LICENSE_seexpr.txt seexpr-build/seexpr-python/LICENSE_seexpr.txt
      - name: Upload qualified Python SDK
        uses: actions/upload-artifact@v6
        with:
          name: SeExpr-Python-${{ runner.os }}-${{ matrix.backend }}-${{ matrix.qt_api || 'pyqt5' }}-${{ github.sha }}
          path: seexpr-build/seexpr-python
          if-no-files-found: error
      - name: Retain qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SeExpr-reports-${{ runner.os }}-${{ matrix.backend }}-${{ matrix.qt_api || 'pyqt5' }}-${{ github.sha }}
          path: |
            seexpr-llvm-dependency.log
            seexpr-configure.log
            seexpr-build.log
            seexpr-tests.log
            seexpr-build/seexpr-tests.xml
            seexpr-sdk-install.log
            seexpr-sdk-configure.log
            seexpr-sdk-build.log
            seexpr-sdk-tests.log
          if-no-files-found: warn

  sanitizer:
    name: Linux ASan and UBSan
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install sanitizer qualification dependencies
        run: |
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=3
          sudo apt-get install -y bison flex
      - name: Configure instrumented core and parser corpus
        shell: bash
        run: |
          set -o pipefail
          cmake -S ci-scripts/seexpr -B seexpr-sanitizer -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSEEXPR_QUALIFY_SANITIZERS=ON -DBUILD_SEEXPR_PYTHON=OFF 2>&1 | tee seexpr-sanitizer-configure.log
      - name: Build instrumented core and parser corpus
        shell: bash
        run: |
          set -o pipefail
          cmake --build seexpr-sanitizer --config RelWithDebInfo --parallel 4 2>&1 | tee seexpr-sanitizer-build.log
      - name: Test memory and undefined behavior safeguards
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir seexpr-sanitizer -C RelWithDebInfo --output-on-failure --output-junit seexpr-sanitizer-tests.xml --no-tests=error --timeout 120 2>&1 | tee seexpr-sanitizer-tests.log
      - name: Report sanitizer qualification failure
        if: failure()
        run: python ci-scripts/seexpr/report.py seexpr-sanitizer-configure.log seexpr-sanitizer-build.log seexpr-sanitizer-tests.log
      - name: Retain sanitizer qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SeExpr-sanitizer-reports-${{ github.sha }}
          path: |
            seexpr-sanitizer-configure.log
            seexpr-sanitizer-build.log
            seexpr-sanitizer-tests.log
            seexpr-sanitizer/seexpr-sanitizer-tests.xml
          if-no-files-found: warn
