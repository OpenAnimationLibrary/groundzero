name: No PII

# Fails a pull request whose title, description, commit messages or added
# lines carry personal data or a private Claude Code session link.
# The rule and the patterns are in CLAUDE.md and ci-scripts/no_pii.py.
#
# The GitHub integration of Claude Code adds a link to its session to the
# description of every pull request it opens. The check removes such links
# (and Claude-Session lines) from the description itself before it scans, so
# that footer no longer fails every new pull request; what it cannot fix
# (an e-mail address, a link in a commit or in a file) still fails.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to scan at this branch commit
        required: true
        type: number
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read pull request metadata
        run: |
          mkdir -p "$RUNNER_TEMP/pii"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pii/pull-request.json"
          python3 - <<'PYCODE'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pii"
          pr = json.loads((root / "pull-request.json").read_text())
          if pr["head"]["sha"] != os.environ["EXPECTED_HEAD"]:
              raise SystemExit("The pull request head changed; scan its current commit")
          for name, value in {
              "body": pr.get("body") or "",
              "title": pr["title"],
              "base": pr["base"]["sha"],
              "head": pr["head"]["sha"],
              "same-repo": str(pr["head"]["repo"]["full_name"] == os.environ["GITHUB_REPOSITORY"]).lower(),
          }.items():
              (root / name).write_text(value, encoding="utf-8")
          PYCODE

      - name: Remove session links from the description
        run: |
          SAME_REPO="$(cat "$RUNNER_TEMP/pii/same-repo")"
          python3 ci-scripts/no_pii.py clean < "$RUNNER_TEMP/pii/body" > "$RUNNER_TEMP/pii/cleaned"
          if cmp -s "$RUNNER_TEMP/pii/body" "$RUNNER_TEMP/pii/cleaned"; then exit 0; fi
          # A fork's token cannot edit the pull request: the scan then fails
          # on the original description, as before
          if [ "$SAME_REPO" = "true" ] &&
             gh api -X PATCH "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
               -F "body=@$RUNNER_TEMP/pii/cleaned" > /dev/null; then
            cp "$RUNNER_TEMP/pii/cleaned" "$RUNNER_TEMP/pii/body"
            echo "::notice title=No PII::Removed session links from the description"
          fi

      - name: Scan pull request
        run: |
          cd "$RUNNER_TEMP/pii"
          BASE_SHA="$(cat base)"
          HEAD_SHA="$(cat head)"
          { cat title; echo; cat body; echo; } > description
          git -C "$GITHUB_WORKSPACE" log --format='%B' "$BASE_SHA..$HEAD_SHA" > commit-messages
          git -C "$GITHUB_WORKSPACE" diff --no-color -U0 "$BASE_SHA...$HEAD_SHA" |
            grep '^+' | grep -v '^+++' | cut -c2- > added-lines || true
          if ! python3 "$GITHUB_WORKSPACE/ci-scripts/no_pii.py" scan description commit-messages added-lines > hits; then
            while IFS= read -r hit; do echo "::error title=Personal data or session link::$hit"; done < hits
            exit 1
          fi
