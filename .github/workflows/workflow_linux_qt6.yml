name: Linux Qt 6 (experimental)

# Tracks the Qt 6 port. Qt 5 stays the default and is what the other workflows
# build; this job configures with -DOT_QT_MAJOR_VERSION=6 and then builds with
# "ninja -k 0", which is expected to fail until the port is done. It never
# runs on pull requests (started by hand only, so PRs keep the Linux application
# and installed-package checks): error counts in the summary and uploaded logs measure
# progress.
# Manual port checks use isolated runners and run-scoped artifacts; allow parallel runs.
on: # zizmor: ignore[concurrency-limits]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Ubuntu-Qt6:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install libraries
      # Same as workflow_linux.yml with the Qt 5 packages replaced by their
      # Qt 6 counterparts (qt6-base-dev provides libqt6opengl6-dev, i.e. the
      # OpenGL and OpenGLWidgets modules) and the 24.04 names of
      # libfreetype6-dev and libturbojpeg-dev. No libfuse2: no AppImage here.
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bison flex cmake pkg-config ninja-build ccache libboost-all-dev qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools qt6-5compat-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-multimedia-dev qt6-wayland qt6-svg-dev qt6-serialport-dev libsuperlu-dev liblz4-dev libusb-1.0-0-dev liblzo2-dev libpng-dev libjpeg-dev libglew-dev freeglut3-dev libfreetype-dev libjson-c-dev libmypaint-dev libopencv-dev libturbojpeg0-dev libomp-dev

    - name: Set up cache
      run: mkdir -p /home/runner/.ccache

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /home/runner/.ccache
        key: ${{ runner.os }}-qt6-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-qt6-

    - name: Build libtiff
      run: |
        cd thirdparty/tiff-4.0.3
        CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-jbig
        make -j "$(nproc)"

    - name: Configure
      shell: bash
      run: |
        mkdir -p toonz/build
        cd toonz/build
        cmake ../sources -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DOT_QT_MAJOR_VERSION=6 -DWITH_TRANSLATION=OFF 2>&1 | tee cmake.log

    - name: Build (expected to fail)
      continue-on-error: true
      shell: bash
      run: |
        export CCACHE_DIR=/home/runner/.ccache
        cd toonz/build
        set +e
        ninja -k 0 > build.log 2>&1
        status=$?
        {
          echo "### Qt 6 build"
          echo
          echo "- ninja exit status: $status"
          echo "- failed build steps: $(grep -c '^FAILED: ' build.log)"
          echo "- compiler errors: $(grep -c ' error: ' build.log)"
          echo
          echo "Most frequent errors:"
          echo
          echo '```'
          grep -o ' error: .*' build.log | sort | uniq -c | sort -rn | head -40
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        tail -n 100 build.log
        exit $status

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: Qt6-build-logs-${{ github.sha }}
        path: |
          toonz/build/cmake.log
          toonz/build/build.log
          toonz/build/CMakeFiles/CMakeConfigureLog.yaml
          toonz/build/CMakeFiles/CMakeError.log
        if-no-files-found: ignore
