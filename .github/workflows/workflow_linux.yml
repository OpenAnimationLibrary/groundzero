name: Linux Build

on:
  workflow_dispatch:
  workflow_call:
  # Every pull request, also one stacked on another branch
  pull_request:
  # Also check edition itself after each merge: pull requests that each build
  # on their own can still break the build together.
  push:
    branches:
      - edition

permissions:
  contents: read

# Reusable workflows inherit the caller's name, so include the platform.
# Only superseded pull request builds may cancel an in-progress build.
concurrency:
  group: ${{ github.workflow }}-linux-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Ubuntu:
    # Build on the oldest supported LTS: glibc/libstdc++ symbol versioning is
    # backward compatible only, so an AppImage built on 24.04 requires
    # GLIBC_2.38 / GLIBCXX_3.4.32 and will not start on 22.04 (see #7001).
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      matrix:
        compiler: [gcc]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Enforce the ten-check pull request budget
      run: |
        ruby ci-scripts/check_ci_budget.rb
        ruby ci-scripts/tests/test_ci_budget.rb

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Verify native diagnostic isolation
      run: python3 -m unittest discover -s ci-scripts/tests -p test_native_ui_diagnostics.py

    - name: Verify original native crash identity and process contracts
      run: |
        python3 -m unittest discover -s ci-scripts/tests -p test_native_macos_crash.py -v
        python3 -m unittest discover -s ci-scripts/tests -p test_windows_process.py -v

    - name: Verify early harness failure reporting
      run: python3 -m unittest discover -s ci-scripts/tests -p test_harness_reporting.py -v

    - name: Verify native lifecycle harness contracts
      run: python3 -m unittest discover -s ci-scripts/tests -p test_native_ui_lifecycle.py

    - name: Verify original native core capture
      run: python3 -m unittest discover -s ci-scripts/tests -p test_native_ui_core.py -v

    - name: Verify bounded desktop GL launcher
      run: python3 -m unittest discover -s ci-scripts/tests -p test_windows_gl_test.py -v

    - name: Verify CI failure classification and pagination
      run: python3 -m unittest discover -s ci-scripts/tests -p test_ci_audit.py -v

    - name: Verify Unicode regression reporting
      run: python3 -m unittest discover -s ci-scripts/tests -p test_regression_reporting.py -v

    - name: Verify isolated image-cache leak qualification contracts
      run: python3 -m unittest discover -s ci-scripts/tests -p test_image_cache_lsan.py -v

    - name: Install libraries
      id: libraries
      run: |
        # The runner's Azure package mirror stalls in the middle of downloads,
        # which left this step hanging for up to an hour: use the main Ubuntu
        # archive (the hosted images list the mirror in apt-mirrors.txt), and
        # time out and retry a stalled request instead of waiting on it
        sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
        # A stalled or refused mirror request is retried, three times at most
        ok=0
        for attempt in 1 2 3; do
          if timeout 600 sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=5 &&
             timeout 900 sudo apt-get install -y xvfb libgl1-mesa-dri -o Acquire::http::Timeout=30 -o Acquire::Retries=5 build-essential cmake pkg-config ninja-build ccache bison flex gdb python3-dev libboost-all-dev qtbase5-dev qt6-base-dev qt5-qmake qtdeclarative5-dev qtdeclarative5-dev-tools qttools5-dev qttools5-dev-tools qttranslations5-l10n qtmultimedia5-dev qtwayland5 libqt5svg5-dev libqt5opengl5-dev libqt5multimedia5-plugins libqt5serialport5-dev libsuperlu-dev liblz4-dev libusb-1.0-0-dev liblzo2-dev libpng-dev libjpeg-dev libglew-dev freeglut3-dev libfreetype6-dev libjson-c-dev libmypaint-dev libopencv-dev libturbojpeg-dev libomp-dev libfuse2 ffmpeg; then ok=1; break; fi
          echo "::warning title=apt::attempt $attempt failed, retrying"
          sleep 20
        done
        [ "$ok" = 1 ]

    - name: Set up cache
      run: mkdir -p /home/runner/.ccache

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /home/runner/.ccache
        key: ${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.compiler }}-
          ${{ runner.os }}-

    - name: Build libtiff
      run: |
        cd thirdparty/tiff-4.0.3
        CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-jbig
        make -j "$(nproc)"

    - name: Build cel regression targets
      id: native_targets
      env:
        C_COMPILER: ${{ matrix.cc }}
        CXX_COMPILER: ${{ matrix.cxx }}
      run: |
        export CCACHE_DIR=/home/runner/.ccache
        export CC="ccache $C_COMPILER"
        export CXX="ccache $CXX_COMPILER"
        cd toonz
        mkdir build
        cd build
        set -o pipefail
        cmake ../sources -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER="$CXX_COMPILER" -DCMAKE_C_COMPILER="$C_COMPILER" -DWITH_TRANSLATION=ON -DBUILD_UI_PORT_TESTS=ON -DBUILD_CELFX_TESTS=ON -DBUILD_CADMIUM_TESTS=ON -DBUILD_LUT3D_TESTS=ON -DBUILD_PARTICLE_CACHE_TESTS=ON -DBUILD_RELIABILITY_TESTS=ON -DBUILD_DEFORMER_TESTS=ON -DBUILD_AUTOPATCH_TESTS=ON -DBUILD_STREAM_TESTS=ON -DBUILD_SCENEBENCH_TESTS=ON -DBUILD_FXRENDER_TESTS=ON -DBUILD_FFMPEG_TESTS=ON -DBUILD_PSD_TESTS=ON -DBUILD_EXR_TESTS=ON -DBUILD_SEEXPR_TESTS=ON -DBUILD_SEEXPR_PYTHON=ON -DPython3_EXECUTABLE="$(command -v python)" -DCMAKE_CXX_FLAGS=-Werror=return-type 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
        # -k 0: keep going, so one run reports every file that fails
        ninja -k 0 OpenToonz tconverter celfx_tests cadmium_tests ui_port_tests particlecache_tests referencecolormatch_test neuralstyle_host_test neuralstyle_test neuralstyle_editor_test externfx_process_test plugin_probe_test 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

    - name: Qualify native neural host
      run: python ci-scripts/neural-style/host.py

    - name: Retain reference style qualification and visual examples
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ReferenceStyle-${{ runner.os }}-${{ github.sha }}
        path: neural-evaluation/report
        if-no-files-found: warn

    - name: Test particle cache integration
      id: particle_tests
      working-directory: toonz/build
      run: |
        set -o pipefail
        QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ctest --output-on-failure --output-junit particle-tests.xml --timeout 300 --no-tests=error -R '^(particlecache_|referencecolormatch$)' 2>&1 | tee particle-tests-output.txt

    - name: Report particle test failures
      if: ${{ failure() && steps.particle_tests.outcome == 'failure' }}
      run: python3 ci-scripts/report_particle_tests.py toonz/build/particle-tests-output.txt

    - name: Generate particle cache example project
      id: particle_demo
      timeout-minutes: 10
      working-directory: toonz/build
      run: |
        set -o pipefail
        QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a bin/particlecache_demo "$PWD/particlecache-examples" "$GITHUB_WORKSPACE/doc/particlecache-examples/README.md" 2>&1 | tee particle-demo-output.txt

    - name: Report particle example generation failures
      if: ${{ failure() && steps.particle_demo.outcome == 'failure' }}
      run: python3 ci-scripts/report_particle_tests.py toonz/build/particle-demo-output.txt

    - name: Upload particle cache example project
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: particle-cache-examples-${{ runner.os }}-${{ matrix.compiler }}
        path: toonz/build/particlecache-examples
        if-no-files-found: error

    - name: Test cel effects
      id: cel_tests
      working-directory: toonz/build
      run: |
        set -o pipefail
        QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ctest --output-on-failure --output-junit cel-tests.xml --no-tests=error -R '^celfx_' 2>&1 | tee cel-tests-output.txt

    - name: Test Cadmium adapters
      if: ${{ !cancelled() && hashFiles('toonz/build/bin/cadmium_toonzraster_test') != '' }}
      working-directory: toonz/build
      run: |
        QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ctest --output-on-failure --no-tests=error -R '^cadmium_'

    - name: Test native UI features
      id: ui_tests
      working-directory: toonz/build
      run: |
        set -o pipefail
        QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a python3 ../../ci-scripts/run_regression_tests.py --report ui-tests.xml --include-prefix ui_ ui_vector_opacity ui_vector_profilemanager ui_vector_gradientanimation ui_vector_svgopacity ui_vector_pliprofile ui_vector_morphworkflow ui_vector_contour_outline ui_mediacache ui_functioncurveoperations ui_functionworkflow ui_commandpalette ui_widgetinspector ui_themeapplication ui_themeproperties ui_uitranslations ui_languagemanager ui_messagehistory ui_diagnosticswriter ui_diagnosticsservice 2>&1 | tee ui-tests-output.txt

    - name: Test native application integration
      id: ui_integration
      if: ${{ !cancelled() && steps.native_targets.outcome == 'success' }}
      # Full run, required reviewed-clear run, six isolated/debugger pairs and
      # original crash diagnostics; subprocess/cleanup deadlines stay unchanged.
      timeout-minutes: 45
      env:
        GZ_CAST_WORKFLOW_REPORT: ${{ github.workspace }}/toonz/build/cast-workflow-metrics.json
      run: |
        set -euo pipefail
        native_core_directory=$(mktemp -d "$GITHUB_WORKSPACE/toonz/build/native-ui-cores.XXXXXX")
        native_core_report="$GITHUB_WORKSPACE/toonz/build/ui-integration-output-original-core.txt"
        native_core_pattern_recorded=0
        restore_native_core_state() {
          native_status=$?
          trap - EXIT
          set +e
          ulimit -S -c 0
          cleanup_status=0
          if [ "$native_core_pattern_recorded" = 1 ]; then
            if ! timeout --kill-after=2s 8s sudo -n sysctl -w \
                "kernel.core_pattern=$native_core_previous_pattern" >/dev/null; then
              printf 'Original core kernel-pattern restoration failed.\n' >> "$native_core_report"
              cleanup_status=1
            fi
          fi
          # Raw cores are never uploaded, including when collection/setup fails.
          if ! rm -f -- "$native_core_directory"/core.* || ! rmdir -- "$native_core_directory"; then
            printf 'Original raw core directory cleanup failed.\n' >> "$native_core_report"
            cleanup_status=1
          fi
          if [ "$native_status" -eq 0 ] && [ "$cleanup_status" -ne 0 ]; then
            native_status=$cleanup_status
          fi
          exit "$native_status"
        }
        trap restore_native_core_state EXIT
        trap 'exit 143' TERM
        trap 'exit 130' INT
        native_core_previous_pattern=$(sysctl -n kernel.core_pattern)
        native_core_pattern_recorded=1
        timeout --kill-after=2s 8s sudo -n sysctl -w "kernel.core_pattern=$native_core_directory/core.%p" >/dev/null
        # The runner enables a per-core soft cap for its original OpenToonz
        # launch tree, then restores zero before clear/diagnostic processes.
        ulimit -S -c 0
        QT_QPA_PLATFORM=xcb xvfb-run -a python3 ci-scripts/run_native_ui_test.py toonz/build/bin/OpenToonz stuff --require-function-workflow --require-offline-gl-workflow --require-vector-workflows --require-combined-workflows --linux-crash-debugger --linux-original-core-directory "$native_core_directory" --output toonz/build/ui-integration-output.txt

    - name: Measure native artist workloads
      id: artist_benchmark
      if: ${{ !cancelled() && steps.native_targets.outcome == 'success' }}
      run: |
        QT_QPA_PLATFORM=xcb xvfb-run -a python3 ci-scripts/run_native_ui_test.py toonz/build/bin/OpenToonz stuff --artist-benchmark --output toonz/build/artist-workload-output.txt

    - name: Report artist workload failure
      if: ${{ failure() && steps.artist_benchmark.outcome == 'failure' }}
      run: python3 ci-scripts/report_ui_tests.py toonz/build/artist-workload-output.txt

    - name: Upload artist workflow evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: artist-workflow-linux-${{ matrix.cxx }}
        path: |
          toonz/build/artist-workload-output.*
          toonz/build/ui-integration-output*.txt
          toonz/build/ui-tests-output.txt
        if-no-files-found: ignore

    - name: Report native application integration failure
      if: ${{ failure() && steps.ui_integration.outcome == 'failure' }}
      run: python3 ci-scripts/report_ui_tests.py toonz/build/ui-integration-output.txt

    - name: Report native application crash stack
      if: ${{ failure() && steps.ui_integration.outcome == 'failure' }}
      run: |
        if [ -f toonz/build/ui-integration-output-original-core.txt ]; then
          python3 ci-scripts/report_ui_tests.py toonz/build/ui-integration-output-original-core.txt "Original native application crash stack"
        fi
        if [ -f toonz/build/ui-integration-output-debugger.txt ]; then
          python3 ci-scripts/report_ui_tests.py toonz/build/ui-integration-output-debugger.txt "Native application crash stack"
        fi

    - name: Upload native animation workflow diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: animation-workflow-linux
        path: toonz/build/ui-integration-output*.txt
        if-no-files-found: ignore

    - name: Report native UI failures
      if: ${{ failure() && steps.ui_tests.outcome == 'failure' }}
      run: python3 ci-scripts/report_ui_tests.py toonz/build/ui-tests-output.txt

    - name: Diagnose Function Editor crash
      if: ${{ failure() && steps.ui_tests.outcome == 'failure' }}
      working-directory: toonz/build
      run: |
        # Diagnostic only: the original CTest failure remains authoritative.
        # Run only this crashed fixture, not the complete failed test suite.
        if grep -Eq 'ui_functionworkflow[[:space:]].*(SegFault|Exception)' ui-tests-output.txt; then
          set -o pipefail
          QT_QPA_PLATFORM=offscreen timeout --kill-after=5s 60s gdb --batch \
            -ex 'set pagination off' -ex 'set print frame-arguments none' \
            -ex run -ex 'thread apply all backtrace 30' \
            --args bin/ui_functionworkflow_test 2>&1 | tee function-workflow-debugger.txt
        fi

    - name: Report Function Editor crash stack
      if: ${{ failure() && hashFiles('toonz/build/function-workflow-debugger.txt') != '' }}
      run: python3 ci-scripts/report_ui_tests.py toonz/build/function-workflow-debugger.txt 'Function Editor crash stack'

    - name: Retain native UI diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Native-UI-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
        path: |
          toonz/build/ui-tests.xml
          toonz/build/ui-tests-output.txt
          toonz/build/ui-integration-output*.txt
          toonz/build/function-workflow-debugger.txt
        if-no-files-found: ignore

    - name: Diagnose cel UI crash
      if: ${{ failure() && steps.cel_tests.outcome == 'failure' }}
      working-directory: toonz/build
      run: |
        if [ -f cel-tests-output.txt ] && grep -q 'celfx_colorkeep_ui.*SegFault' cel-tests-output.txt; then
          sudo apt-get install -y gdb
          QT_QPA_PLATFORM=offscreen timeout 45s gdb --batch -ex run -ex 'thread apply all backtrace' \
            --args bin/celcolorkeep_ui_test ../../stuff/profiles/layouts/fxs/STD_celColorKeepFx.xml \
            2>&1 | tee -a cel-tests-output.txt
        fi

    - name: Report cel test failures
      if: ${{ failure() && steps.cel_tests.outcome == 'failure' }}
      env:
        CEL_TEST_OUTCOME: ${{ steps.cel_tests.outcome }}
      run: >-
        python3 ci-scripts/report_cel_tests.py toonz/build/cel-tests-output.txt
        --outcome "$CEL_TEST_OUTCOME"

    - name: Build application
      id: application_build
      if: ${{ !cancelled() && steps.native_targets.outcome == 'success' }}
      working-directory: toonz/build
      run: |
        export CCACHE_DIR=/home/runner/.ccache
        set -o pipefail
        ninja -k 0 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

    - name: Test SeExpr native integration
      id: seexpr_tests
      if: ${{ !cancelled() && steps.application_build.outcome == 'success' }}
      working-directory: toonz/build
      env:
        SEEXPR_LINUX_CORE_DIRECTORY: ${{ github.workspace }}/toonz/build/seexpr-native-cores
      run: |
        set -o pipefail
        mkdir -p "$SEEXPR_LINUX_CORE_DIRECTORY"
        chmod 700 "$SEEXPR_LINUX_CORE_DIRECTORY"
        collect_native_test_crashes() {
          native_test_status=$?
          trap - EXIT
          set +e
          timeout --kill-after=5s 115s python ../../ci-scripts/seexpr/native_crashes.py \
            --core-directory "$SEEXPR_LINUX_CORE_DIRECTORY" \
            --binary-directory "$PWD/bin" \
            --report "$PWD/seexpr-native-tests-debugger.txt"
          native_collector_status=$?
          if [ "$native_collector_status" -ne 0 ]; then
            printf 'Native crash collector exited with status %s.\n' "$native_collector_status" >> seexpr-native-tests-debugger.txt
          fi
          rm -f -- "$SEEXPR_LINUX_CORE_DIRECTORY"/core.*
          exit "$native_test_status"
        }
        trap collect_native_test_crashes EXIT
        sudo sysctl -w "kernel.core_pattern=$SEEXPR_LINUX_CORE_DIRECTORY/core.%p"
        ulimit -c unlimited
        QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ctest --output-on-failure --output-junit seexpr-tests.xml --no-tests=error --timeout 180 -R '^seexpr_' 2>&1 | tee seexpr-tests-output.txt

    - name: Report SeExpr test failures
      if: ${{ failure() && steps.seexpr_tests.outcome == 'failure' }}
      run: python ci-scripts/seexpr/report.py toonz/build/seexpr-tests-output.txt

    - name: Report native SeExpr crash stack
      if: ${{ failure() && steps.seexpr_tests.outcome == 'failure' }}
      run: |
        report=toonz/build/seexpr-native-output-debugger.txt
        if [ -f "$report" ]; then
          python ci-scripts/seexpr/report.py "$report"
        fi
        report=toonz/build/seexpr-native-tests-debugger.txt
        if [ -f "$report" ]; then
          python ci-scripts/seexpr/report.py "$report"
        fi

    - name: Retain SeExpr native diagnostics
      if: ${{ always() && steps.seexpr_tests.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: SeExpr-native-diagnostics-${{ github.sha }}
        path: |
          toonz/build/seexpr-tests-output.txt
          toonz/build/seexpr-tests.xml
          toonz/build/seexpr-native-output.txt
          toonz/build/seexpr-native-output-debugger.txt
          toonz/build/seexpr-native-tests-debugger.txt
        if-no-files-found: warn

    - name: Measure SeExpr full-resolution rendering
      id: seexpr_performance
      timeout-minutes: 10
      working-directory: toonz/build
      run: |
        set -o pipefail
        timeout 570 bin/seexpr_fx_test --benchmark 2>&1 | tee seexpr-performance.txt

    - name: Report SeExpr performance failure
      if: ${{ failure() && steps.seexpr_performance.outcome == 'failure' }}
      run: python ci-scripts/seexpr/report.py toonz/build/seexpr-performance.txt

    - name: Retain SeExpr performance measurements
      if: ${{ always() && steps.seexpr_performance.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: SeExpr-performance-${{ github.sha }}
        path: toonz/build/seexpr-performance.txt
        if-no-files-found: warn

    - name: Test reliability and performance invariants
      if: ${{ !cancelled() && steps.application_build.outcome == 'success' }}
      working-directory: toonz/build
      run: |
        QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a python3 ../../ci-scripts/run_regression_tests.py castworkflow rasterallocation timagecache childstack_lifetime levelselection save_transaction movierenderqueue levelupdater_abort trenderer_startup renderoutputbudget executor_submission deformer autopatchoutline externfx_process plugin_probe_single plugin_probe_empty compressed_stream scenebench fxrender ffmpeg_public tiio_ffmpeg tiio_psd tiio_exr_level

    - name: Qualify image-cache builder release with LeakSanitizer
      if: ${{ !cancelled() && steps.application_build.outcome == 'success' }}
      timeout-minutes: 40
      env:
        CCACHE_DIR: /home/runner/.ccache
      run: >-
        python3 ci-scripts/qualify_image_cache_lsan.py
        --root . --build toonz/build --output toonz/build/image-cache-lsan

    - name: Upload reliability diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux-reliability-results
        path: |
          toonz/build/reliability-tests.xml
          toonz/build/cast-workflow-metrics.json
          toonz/build/stdfx/fxrender-output
          toonz/build/image/ffmpeg-test-output
          toonz/build/image-cache-lsan
        if-no-files-found: ignore

    # Keep successfully compiled objects even when a regression test fails.
    - name: Save compiler cache
      if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /home/runner/.ccache
        key: ${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}

    # The GLB loader, pose and renderer build and test on their own (no Qt, no
    # graphics context), in seconds: run them on every pull request, with the
    # address and undefined behaviour sanitizers
    - name: GLB loader and renderer tests
      run: |
        set -o pipefail
        cmake -S toonz/sources/glb -B glb-build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
        cmake --build glb-build 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
        cd glb-build
        ctest --output-on-failure --timeout 600

    # Show the errors on the pull request (summary and annotations) without
    # having to open the full log
    - name: Report build errors
      if: failure()
      run: |
        log="$GITHUB_WORKSPACE/build.log"
        [ -f "$log" ] || exit 0
        # Keep the failed target visible even when many linker references fill
        # the bounded error excerpt below.
        grep '^FAILED:' "$log" | head -10 | while IFS= read -r line; do
          echo "::error title=Failed build target::$line"
        done || true
        grep -E ': (fatal )?error:|CMake Error|undefined reference|ld returned|^FAILED:' "$log" | sort -u | head -60 > errors.txt || true
        {
          echo "## Linux build errors"
          echo '```'
          cat errors.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        prefix="$GITHUB_WORKSPACE/"
        grep -E ': (fatal )?error:' errors.txt | head -40 | while IFS= read -r line; do
          file=${line%%:*}; rest=${line#*:}; lineno=${rest%%:*}
          msg=${line#*error: }
          file=${file#"$prefix"}; file=${file#../sources/}
          case "$file" in /*|toonz/*) ;; *) file="toonz/sources/$file" ;; esac
          echo "::error file=${file},line=${lineno}::${msg}"
        done
        grep -vE ': (fatal )?error:' errors.txt | head -10 | while IFS= read -r line; do
          echo "::error::${line}"
        done

    - name: Create Artifact
      env:
        ARTIFACT_NAME: Opentoonz-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
      run: |
        cd toonz/build
        sudo ninja install

        mkdir -p appdir/usr
        cp -r /opt/opentoonz/* appdir/usr
        cp appdir/usr/share/applications/*.desktop appdir
        cp appdir/usr/share/icons/hicolor/*/apps/*.png appdir

        mkdir artifact
        # Copy rather than move: the AppImage keeps its own
        # usr/share/opentoonz/stuff so it can seed a config when run on its
        # own, while the tarball still ships portablestuff next to it for
        # portable-mode testing.
        cp -r appdir/usr/share/opentoonz/stuff artifact/portablestuff

        wget -q -c --tries=5 --timeout=60 --waitretry=10 'https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage'
        wget -q -c --tries=5 --timeout=60 --waitretry=10 'https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage'
        wget -q -c --tries=5 --timeout=60 --waitretry=10 'https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage'
        chmod 755 linuxdeploy-x86_64.AppImage
        chmod 755 linuxdeploy-plugin-qt-x86_64.AppImage
        chmod 755 linuxdeploy-plugin-appimage-x86_64.AppImage

        cat << EOF > apprun.sh
        #!/usr/bin/env bash
        exec "\${APPDIR}/usr/bin/OpenToonz" "\$@"
        EOF
        chmod 755 apprun.sh

        export LD_LIBRARY_PATH='appdir/usr/lib/opentoonz'
        # appimagetool's AppStream check fetches URLs from the .appdata.xml
        # (e.g. the issue tracker link) to confirm they're reachable; a
        # transient network error there fails the whole build. Skip it.
        export LDAI_NO_APPSTREAM=1
        ./linuxdeploy-x86_64.AppImage --appdir=appdir --plugin=qt --output=appimage --custom-apprun=apprun.sh \
        --executable=appdir/usr/bin/lzocompress \
        --executable=appdir/usr/bin/lzodecompress \
        --executable=appdir/usr/bin/tcleanup \
        --executable=appdir/usr/bin/tcomposer \
        --executable=appdir/usr/bin/tconverter \
        --executable=appdir/usr/bin/tfarmcontroller \
        --executable=appdir/usr/bin/tfarmserver
        mv OpenToonz*.AppImage artifact/OpenToonz.AppImage
        mv artifact "$ARTIFACT_NAME"
        tar zcf "$ARTIFACT_NAME.tar.gz" "$ARTIFACT_NAME"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Opentoonz-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
        path: toonz/build/Opentoonz-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}.tar.gz

    # Independent suites run after native packaging and also after unrelated
    # failures. Consolidation must not prevent their diagnostics from running.
    - name: Lint GitHub Actions workflows
      if: ${{ !cancelled() }}
      timeout-minutes: 5
      run: |
        set -euo pipefail
        audit_tools="$RUNNER_TEMP/groundzero-workflow-actionlint"
        mkdir -p "$audit_tools"
        release="https://github.com/rhysd/actionlint/releases/download/v1.7.12"
        curl --fail --location --silent --show-error --retry 2 --max-time 90 \
          "$release/actionlint_1.7.12_linux_amd64.tar.gz" \
          --output "$audit_tools/actionlint.tar.gz"
        printf '%s  %s\n' \
          '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
          "$audit_tools/actionlint.tar.gz" | sha256sum --check --strict
        tar -xzf "$audit_tools/actionlint.tar.gz" -C "$audit_tools" actionlint
        command -v shellcheck >/dev/null
        if ! "$audit_tools/actionlint" -color=false \
          2>&1 | tee workflow-actionlint.log; then
          echo '::error title=Workflow lint::actionlint or ShellCheck reported a workflow error'
          exit 1
        fi

    - name: Audit GitHub Actions security
      if: ${{ !cancelled() }}
      timeout-minutes: 5
      run: |
        set -euo pipefail
        audit_tools="$RUNNER_TEMP/groundzero-workflow-zizmor"
        mkdir -p "$audit_tools"
        release="https://github.com/zizmorcore/zizmor/releases/download/v1.32.0"
        curl --fail --location --silent --show-error --retry 2 --max-time 90 \
          "$release/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
          --output "$audit_tools/zizmor.tar.gz"
        printf '%s  %s\n' \
          'bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b' \
          "$audit_tools/zizmor.tar.gz" | sha256sum --check --strict
        tar -xzf "$audit_tools/zizmor.tar.gz" -C "$audit_tools" zizmor
        if ! "$audit_tools/zizmor" --offline .github/workflows .github/dependabot.yml \
          2>&1 | tee workflow-zizmor.log; then
          echo '::error title=Workflow security::zizmor reported an unsuppressed security finding'
          exit 1
        fi

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      id: node_runtime
      if: ${{ !cancelled() }}
      with:
        node-version: '22'
        package-manager-cache: false

    - name: Install locked stylesheet and wiki tools
      id: style_toolchain
      if: ${{ !cancelled() && steps.node_runtime.outcome == 'success' }}
      run: |
        set -euo pipefail
        npm ci --prefix ci-scripts/style-toolchain --ignore-scripts --no-fund
        echo "$GITHUB_WORKSPACE/ci-scripts/style-toolchain/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Test release notes
      id: release_notes
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        python3 -m unittest discover -s .github/scripts -p test_release_notes.py -v \
          2>&1 | tee release-notes.log

    - name: Validate and build the reference wiki
      id: reference_wiki
      if: ${{ !cancelled() && steps.style_toolchain.outcome == 'success' }}
      run: |
        set -euo pipefail
        node doc/production-journal/validate-reference-pack.mjs 2>&1 | tee reference-wiki.log
        tiddlywiki doc/production-journal --build index \
          2>&1 | tee -a reference-wiki.log

    # Compare before generating review artifacts so generation cannot repair
    # stale committed output and turn the gate green.
    - name: Check committed stylesheets
      id: qss_check
      if: ${{ !cancelled() && steps.style_toolchain.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        python3 ci-scripts/compile_qss.py --check 2>&1 | tee qss-check.log

    - name: Report stale stylesheets
      if: ${{ failure() && steps.qss_check.outcome == 'failure' }}
      run: |
        set -euo pipefail
        awk '/^STALE / {print $2}' qss-check.log | while IFS= read -r file; do
          echo "::error file=${file},title=Stale stylesheet::Run ci-scripts/compile_qss.py and commit the generated QSS"
        done
        echo '::error title=QSS Check::Committed stylesheets must match their LESS sources'
        {
          echo "## Stylesheet comparison"
          echo '```'
          cat qss-check.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Generate stylesheet review artifacts
      if: ${{ !cancelled() && steps.qss_check.outcome != 'skipped' }}
      run: python3 ci-scripts/compile_qss.py

    - name: Retain stylesheet review artifacts
      if: ${{ !cancelled() && steps.qss_check.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: generated-native-stylesheets
        path: |
          stuff/config/qss/*/*.qss
          qss-check.log
        if-no-files-found: error
        retention-days: 7

    - name: Plugin Manager Qt 5 regressions
      id: plugin_qt5
      if: ${{ !cancelled() && steps.libraries.outcome == 'success' }}
      timeout-minutes: 10
      shell: bash
      run: |
        set -euo pipefail
        cmake -S toonz/sources/toonz/tests/pluginmanager -B plugin-manager-qt5 -G Ninja \
          -DPLUGIN_MANAGER_QT_MAJOR=5 2>&1 | tee plugin-manager-qt5.log
        cmake --build plugin-manager-qt5 2>&1 | tee -a plugin-manager-qt5.log
        ctest --test-dir plugin-manager-qt5 --output-on-failure --no-tests=error \
          --output-junit results.xml 2>&1 | tee -a plugin-manager-qt5.log

    - name: Plugin Manager Qt 6 regressions
      id: plugin_qt6
      if: ${{ !cancelled() && steps.libraries.outcome == 'success' }}
      timeout-minutes: 10
      shell: bash
      run: |
        set -euo pipefail
        cmake -S toonz/sources/toonz/tests/pluginmanager -B plugin-manager-qt6 -G Ninja \
          -DPLUGIN_MANAGER_QT_MAJOR=6 2>&1 | tee plugin-manager-qt6.log
        cmake --build plugin-manager-qt6 2>&1 | tee -a plugin-manager-qt6.log
        ctest --test-dir plugin-manager-qt6 --output-on-failure --no-tests=error \
          --output-junit results.xml 2>&1 | tee -a plugin-manager-qt6.log

    - name: PureRef import regression
      id: pureref_tests
      if: ${{ !cancelled() && steps.libraries.outcome == 'success' }}
      timeout-minutes: 10
      shell: bash
      run: |
        set -euo pipefail
        cmake -S toonz/sources/toonz/tests/pureref -B pureref-build -G Ninja \
          -DQT_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt5 2>&1 | tee pureref-build.log
        cmake --build pureref-build 2>&1 | tee -a pureref-build.log
        ctest --test-dir pureref-build --output-on-failure --no-tests=error \
          --output-junit results.xml 2>&1 | tee -a pureref-build.log

    - name: Neural temporal motion and occlusion
      id: temporal_tests
      if: ${{ !cancelled() && steps.libraries.outcome == 'success' }}
      timeout-minutes: 15
      shell: bash
      run: |
        set -euo pipefail
        cmake -S toonz/sources/neuralstyle/temporal-tests -B temporal-build \
          -DCMAKE_BUILD_TYPE=Release 2>&1 | tee temporal-build.log
        cmake --build temporal-build --parallel 2 2>&1 | tee -a temporal-build.log
        ./temporal-build/neural-temporal-tests 2>&1 | tee -a temporal-build.log

    - name: SeExpr address and undefined behavior sanitizers
      id: sanitizer_tests
      if: ${{ !cancelled() && steps.libraries.outcome == 'success' }}
      timeout-minutes: 25
      shell: bash
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1:strict_string_checks=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        set -euo pipefail
        cmake -S ci-scripts/seexpr -B seexpr-sanitizer -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DSEEXPR_QUALIFY_SANITIZERS=ON -DBUILD_SEEXPR_PYTHON=OFF \
          2>&1 | tee seexpr-sanitizer.log
        cmake --build seexpr-sanitizer --config RelWithDebInfo --parallel 4 \
          2>&1 | tee -a seexpr-sanitizer.log
        ctest --test-dir seexpr-sanitizer -C RelWithDebInfo --output-on-failure \
          --output-junit results.xml --no-tests=error --timeout 120 \
          2>&1 | tee -a seexpr-sanitizer.log

    - name: Report consolidated suite failures
      if: >-
        ${{ failure() && (steps.plugin_qt5.outcome == 'failure' ||
          steps.plugin_qt6.outcome == 'failure' ||
          steps.pureref_tests.outcome == 'failure' || steps.temporal_tests.outcome == 'failure' ||
          steps.sanitizer_tests.outcome == 'failure' || steps.release_notes.outcome == 'failure' ||
          steps.reference_wiki.outcome == 'failure') }}
      run: >-
        python ci-scripts/seexpr/report.py plugin-manager-qt5.log plugin-manager-qt6.log
        pureref-build.log temporal-build.log seexpr-sanitizer.log
        release-notes.log reference-wiki.log

    - name: Retain consolidated suite diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Linux-consolidated-suites-${{ github.sha }}
        path: |
          plugin-manager-qt*.log
          plugin-manager-qt*/results.xml
          plugin-manager-qt*/Testing/Temporary/LastTest.log
          pureref-build.log
          pureref-build/results.xml
          pureref-build/Testing/Temporary/LastTest.log
          temporal-build.log
          seexpr-sanitizer.log
          seexpr-sanitizer/results.xml
          seexpr-sanitizer/Testing/Temporary/LastTest.log
          release-notes.log
          reference-wiki.log
          workflow-actionlint.log
          workflow-zizmor.log
        if-no-files-found: ignore

  InstalledApplication:
    needs: Ubuntu
    # Same revision; actionlint 1.7.12 does not support the newer $/ syntax.
    uses: ./.github/workflows/seexpr-package-smoke.yml # zizmor: ignore[self-repository]
    with:
      platform: linux
      artifact_name: Opentoonz-Linux-gcc-${{ github.sha }}

